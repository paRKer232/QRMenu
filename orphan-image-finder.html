<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orphaned menu photo finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1a1a1a;
        background: #fafafa;
      }
      h1 { font-size: 20px; }
      p.sub { color: #666; margin-top: -8px; }
      .summary {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin: 20px 0;
      }
      .stat {
        background: #fff;
        border: 1px solid #e2e2e2;
        border-radius: 10px;
        padding: 14px 18px;
        min-width: 140px;
      }
      .stat .num { font-size: 22px; font-weight: 700; }
      .stat .label { font-size: 12.5px; color: #777; }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border: 1px solid #e2e2e2;
        border-radius: 10px;
        overflow: hidden;
        font-size: 13.5px;
      }
      th, td {
        text-align: left;
        padding: 8px 12px;
        border-bottom: 1px solid #eee;
      }
      th { background: #f3f3f3; }
      tr.orphan { background: #fff6f6; }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
      }
      .badge.orphan { background: #ffdede; color: #a11; }
      .badge.used { background: #e2f5e2; color: #175c17; }
      button {
        background: #a11;
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        margin-top: 16px;
      }
      button:disabled { background: #ccc; cursor: not-allowed; }
      #status { margin: 16px 0; color: #666; }
      code { background: #eee; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Orphaned menu photo finder</h1>
    <p class="sub">
      Compares every file in the <code>menu-photos</code> bucket against every
      image path still referenced in your menu (items, hero image, logo).
      Nothing is deleted until you press the button at the bottom and confirm.
    </p>
    <div id="status">Loading…</div>
    <div class="summary" id="summary" style="display:none"></div>
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>File</th>
          <th>Size</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <button id="deleteBtn" style="display:none">Delete orphaned files</button>

    <script>
      // Same project/bucket/slug your menu app uses.
      const SUPABASE_URL = "https://kwjqeqkvmnwsbeddhcun.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3anFlcWt2bW53c2JlZGRoY3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NjMxODQsImV4cCI6MjA5NjUzOTE4NH0.OA-lNRtUvprPh4IwYxTBL8-illZ5hvQ3oOuIXT8r800";
      const MENU_SLUG = "cafe-aurora";
      const MENU_BUCKET = "menu-photos";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
      }

      // Walks the whole saved menu (any shape: legacy flat items, or
      // nested subsections) plus the business-level hero/logo fields,
      // and returns every non-empty imagePath found.
      function collectReferencedPaths(state) {
        const paths = new Set();
        (state.sections || []).forEach((sec) => {
          const groups = Array.isArray(sec.subsections)
            ? sec.subsections
            : [{ items: sec.items || [] }];
          groups.forEach((sub) => {
            (sub.items || []).forEach((it) => {
              if (it.imagePath) paths.add(it.imagePath);
            });
          });
        });
        if (state.business) {
          if (state.business.heroImagePath)
            paths.add(state.business.heroImagePath);
          if (state.business.logoPath) paths.add(state.business.logoPath);
        }
        return paths;
      }

      let orphanPaths = [];

      async function run() {
        const statusEl = document.getElementById("status");
        try {
          statusEl.textContent = "Loading menu…";
          const { data: menu, error: menuErr } = await supabaseClient.rpc(
            "get_menu",
            { p_slug: MENU_SLUG },
          );
          if (menuErr) throw menuErr;
          const referenced = collectReferencedPaths(menu || {});

          statusEl.textContent = "Listing files in storage…";
          const { data: files, error: listErr } = await supabaseClient.storage
            .from(MENU_BUCKET)
            .list(MENU_SLUG, { limit: 1000 });
          if (listErr) throw listErr;

          const rows = (files || [])
            .filter((f) => f.id) // skip folder placeholder entries, if any
            .map((f) => {
              const fullPath = `${MENU_SLUG}/${f.name}`;
              const size = (f.metadata && f.metadata.size) || 0;
              const isOrphan = !referenced.has(fullPath);
              return { fullPath, name: f.name, size, isOrphan };
            });

          orphanPaths = rows.filter((r) => r.isOrphan).map((r) => r.fullPath);
          const orphanSize = rows
            .filter((r) => r.isOrphan)
            .reduce((s, r) => s + r.size, 0);
          const totalSize = rows.reduce((s, r) => s + r.size, 0);

          document.getElementById("summary").style.display = "flex";
          document.getElementById("summary").innerHTML = `
            <div class="stat"><div class="num">${rows.length}</div><div class="label">Total files</div></div>
            <div class="stat"><div class="num">${formatBytes(totalSize)}</div><div class="label">Total size</div></div>
            <div class="stat"><div class="num">${orphanPaths.length}</div><div class="label">Orphaned files</div></div>
            <div class="stat"><div class="num">${formatBytes(orphanSize)}</div><div class="label">Orphaned size</div></div>
          `;

          const tbody = document.getElementById("tbody");
          tbody.innerHTML = rows
            .sort((a, b) => (a.isOrphan === b.isOrphan ? 0 : a.isOrphan ? -1 : 1))
            .map(
              (r) => `
            <tr class="${r.isOrphan ? "orphan" : ""}">
              <td>${r.name}</td>
              <td>${formatBytes(r.size)}</td>
              <td><span class="badge ${r.isOrphan ? "orphan" : "used"}">${r.isOrphan ? "Orphaned" : "In use"}</span></td>
            </tr>`,
            )
            .join("");
          document.getElementById("table").style.display = "table";

          const deleteBtn = document.getElementById("deleteBtn");
          if (orphanPaths.length) {
            deleteBtn.style.display = "inline-block";
            deleteBtn.textContent = `Delete ${orphanPaths.length} orphaned file(s) — ${formatBytes(orphanSize)}`;
            deleteBtn.onclick = deleteOrphans;
          }

          statusEl.textContent = "Done.";
        } catch (e) {
          console.error(e);
          statusEl.textContent =
            "Something went wrong — check the browser console for details.";
        }
      }

      async function deleteOrphans() {
        if (!orphanPaths.length) return;
        const ok = confirm(
          `Permanently delete ${orphanPaths.length} orphaned image(s) from storage? This can't be undone.`,
        );
        if (!ok) return;
        const btn = document.getElementById("deleteBtn");
        btn.disabled = true;
        btn.textContent = "Deleting…";
        try {
          const { error } = await supabaseClient.storage
            .from(MENU_BUCKET)
            .remove(orphanPaths);
          if (error) throw error;
          btn.textContent = "Deleted.";
          document.getElementById("status").textContent =
            "Orphaned files removed. Reload this page to verify.";
        } catch (e) {
          console.error(e);
          btn.disabled = false;
          alert("Could not delete files — check the browser console.");
        }
      }

      run();
    </script>
  </body>
</html>
