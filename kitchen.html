<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Kitchen — Live Orders</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Same look as bartender.html — everything else (panel, order-card,
         btn, tab-badge, etc.) is reused as-is from style.css. */
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .bar-shell {
        max-width: 640px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .bar-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      }
      .bar-header h1 {
        font-family: "Sora", sans-serif;
        font-weight: 700;
        font-size: 19px;
        margin: 0;
      }
      .bar-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        object-fit: cover;
        border: 1px solid var(--hairline-strong);
        flex-shrink: 0;
      }
      .bar-header .bar-sub {
        color: var(--muted);
        font-size: 12.5px;
        margin: 2px 0 0;
      }
      .bar-scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 20px calc(30px + env(safe-area-inset-bottom));
      }
      .bar-lock-wrap {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .bar-lock-wrap.hidden,
      .bar-scroll.hidden,
      .icon-btn.hidden,
      .bar-logo.hidden {
        display: none;
      }
    </style>
  </head>

  <body data-theme="sage">
    <div class="bar-shell">
      <div class="bar-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <img class="bar-logo hidden" id="bizLogoHeader" src="" alt="" />
          <div>
            <h1 id="bizNameHeader">🍳 Kitchen — Live Orders</h1>
            <p class="bar-sub" id="bizSubHeader">Meals only — no menu, no editing</p>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="icon-btn hidden" type="button" id="activityBtn" title="Activity log" aria-label="Activity log">🕘</button>
          <button class="icon-btn hidden" type="button" id="lockBtn" title="Lock" aria-label="Lock">🔒</button>
        </div>
      </div>

      <div class="bar-lock-wrap" id="lockWrap">
        <div class="lock-screen">
          <p style="color:var(--muted); font-size:13.5px;">Enter your kitchen PIN.</p>
          <div class="field" style="max-width:180px; margin:14px auto;">
            <input type="text" inputmode="numeric" maxlength="6" id="pinInput" placeholder="••••••" />
          </div>
          <button class="btn btn-primary" id="unlockBtn">Unlock</button>
          <p style="color:var(--muted); font-size:11.5px; margin-top:16px; max-width:260px;">First time setting this up? Make sure the Supabase migration has been run — see <code>kitchen-backend-migration.sql</code> — or the PIN and/or the orders list won't work yet.</p>
        </div>
      </div>

      <div class="bar-scroll hidden" id="boardScroll">
        <div id="ordersListWrap">
          <p class="empty-state" style="padding:20px 0;">Loading…</p>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="activityOverlay">
      <div class="panel" id="activityPanel"></div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <script>
      // Keep these three in sync with index.html / bartender.html — same
      // Supabase project and the same menu slug, since this page reads the
      // same orders.
      const SUPABASE_URL = "https://kwjqeqkvmnwsbeddhcun.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3anFlcWt2bW53c2JlZGRoY3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NjMxODQsImV4cCI6MjA5NjUzOTE4NH0.OA-lNRtUvprPh4IwYxTBL8-illZ5hvQ3oOuIXT8r800";
      const MENU_SLUG = "cafe-aurora";

      const SESSION_KEY = "kitchenOrdersSession_" + MENU_SLUG;

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      let sessionPin = null;
      let staffRole = null; // 'owner' | 'kitchen'
      let kitchenItemIds = null; // null = menu not loaded yet
      let ordersPollTimer = null;
      let menuPollTimer = null;

      function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str == null ? "" : String(str);
        return d.innerHTML;
      }

      function showToast(msg, duration = 2200) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.remove("hidden");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => t.classList.add("hidden"), duration);
      }

      function pinErrorMessage(e, fallback) {
        const msg = e && e.message ? String(e.message) : "";
        const m = msg.match(/PIN_LOCKED:(\d+)/);
        if (m) {
          const secs = parseInt(m[1], 10);
          const mins = Math.ceil(secs / 60);
          return "Too many attempts — try again in " + mins + " min";
        }
        return fallback;
      }

      // Everything ordered for one table shows up as ONE combined order
      // card — a later order for the same table adds its items to that
      // card instead of starting a new one. Items keep their own rows
      // (status) and are ordered oldest first.
      function groupOrdersByOrderId(rows) {
        if (!rows.length) return [];
        const sorted = rows
          .slice()
          .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        const orderIds = [];
        const notes = [];
        sorted.forEach((r) => {
          if (!orderIds.includes(r.order_id)) orderIds.push(r.order_id);
          const n = r.note ? String(r.note).trim() : "";
          if (n && !notes.includes(n)) notes.push(n);
        });
        return [
          {
            order_id: orderIds[0],
            order_ids: orderIds,
            created_at: sorted[0].created_at,
            note: notes.join(" · "),
            items: sorted,
          },
        ];
      }

      /* ---- unlocking ---- */

      async function tryUnlock() {
        const input = document.getElementById("pinInput");
        const val = input ? input.value.trim() : "";
        if (!val) {
          showToast("Enter your PIN first");
          return;
        }
        try {
          const { data, error } = await supabaseClient.rpc(
            "check_staff_pin",
            { p_slug: MENU_SLUG, p_pin: val },
          );
          if (error) throw error;
          // Accepts the kitchen PIN, and the owner PIN so an owner can
          // check in on the kitchen without needing a second PIN. Waiter
          // and bartender PINs are deliberately NOT accepted here.
          if (data === "kitchen" || data === "owner") {
            sessionPin = val;
            staffRole = data;
            try {
              sessionStorage.setItem(
                SESSION_KEY,
                JSON.stringify({ pin: val, role: data }),
              );
            } catch (e) {}
            enterBoard();
          } else if (data === "waiter") {
            showToast("That's a waiter PIN — use the main menu page instead");
          } else if (data === "bartender") {
            showToast("That's a bartender PIN — use bartender.html instead");
          } else {
            showToast("Incorrect PIN");
          }
        } catch (e) {
          showToast(pinErrorMessage(e, "Could not verify PIN — check connection"));
        }
      }

      function restoreSession() {
        try {
          const raw = sessionStorage.getItem(SESSION_KEY);
          if (!raw) return false;
          const parsed = JSON.parse(raw);
          if (parsed && parsed.pin) {
            sessionPin = parsed.pin;
            staffRole = parsed.role || null;
            return true;
          }
        } catch (e) {}
        return false;
      }

      function lockBoard() {
        sessionPin = null;
        staffRole = null;
        kitchenItemIds = null;
        try {
          sessionStorage.removeItem(SESSION_KEY);
        } catch (e) {}
        stopPolling();
        document.getElementById("boardScroll").classList.add("hidden");
        document.getElementById("lockWrap").classList.remove("hidden");
        document.getElementById("lockBtn").classList.add("hidden");
        document.getElementById("activityBtn").classList.add("hidden");
        const pinInput = document.getElementById("pinInput");
        if (pinInput) pinInput.value = "";
      }

      async function enterBoard() {
        document.getElementById("lockWrap").classList.add("hidden");
        document.getElementById("boardScroll").classList.remove("hidden");
        document.getElementById("lockBtn").classList.remove("hidden");
        if (staffRole === "owner") {
          document.getElementById("activityBtn").classList.remove("hidden");
        }
        // The menu has to be loaded first: it's how this page knows which
        // items are meals (sections set to "Kitchen" in the menu editor).
        await loadKitchenMenu();
        refreshOrdersDashboard();
        startPolling();
      }

      /* ---- which items belong to the kitchen ---- */

      // The menu is already public (customers load it with the same anon
      // key), so this page reads it to learn (a) the ids of every item in a
      // section whose station is "kitchen", and (b) the business name,
      // theme and logo for the header. Sections with no station set count
      // as bar items, so nothing appears here until the owner marks a
      // section as Kitchen.
      async function loadKitchenMenu() {
        try {
          const { data, error } = await supabaseClient.rpc("get_menu", {
            p_slug: MENU_SLUG,
          });
          if (error) throw error;
          const ids = [];
          ((data && data.sections) || []).forEach((sec) => {
            if (sec.station !== "kitchen") return;
            (sec.subsections || []).forEach((sub) =>
              (sub.items || []).forEach((i) => ids.push(String(i.id))),
            );
            (sec.items || []).forEach((i) => ids.push(String(i.id))); // legacy sections
          });
          kitchenItemIds = ids;

          const biz = (data && data.business) || {};
          if (biz.name) {
            document.getElementById("bizNameHeader").textContent =
              biz.name + " — Kitchen";
          }
          if (biz.accent) document.body.setAttribute("data-theme", biz.accent);
          if (biz.logo) {
            const img = document.getElementById("bizLogoHeader");
            if (img) {
              img.src = biz.logo;
              img.classList.remove("hidden");
            }
          }
        } catch (e) {
          console.error("Could not load menu:", e);
          // Keep the last known list if we had one; otherwise stay null so
          // the board shows an error instead of guessing.
        }
      }

      function startPolling() {
        if (!ordersPollTimer) {
          ordersPollTimer = setInterval(() => {
            if (document.visibilityState === "visible") refreshOrdersDashboard();
          }, 4000);
        }
        // Pick up section changes made in the owner's menu editor.
        if (!menuPollTimer) {
          menuPollTimer = setInterval(() => {
            if (document.visibilityState === "visible") loadKitchenMenu();
          }, 60000);
        }
      }
      function stopPolling() {
        if (ordersPollTimer) {
          clearInterval(ordersPollTimer);
          ordersPollTimer = null;
        }
        if (menuPollTimer) {
          clearInterval(menuPollTimer);
          menuPollTimer = null;
        }
      }

      /* ---- live orders board ---- */

      async function refreshOrdersDashboard() {
        const wrap = document.getElementById("ordersListWrap");
        if (kitchenItemIds === null) {
          // Menu didn't load — retry rather than show a wrong (empty) board.
          await loadKitchenMenu();
          if (kitchenItemIds === null) {
            if (wrap)
              wrap.innerHTML =
                '<p class="empty-state" style="padding:20px 0;">Could not load the menu.</p>';
            return;
          }
        }
        if (!kitchenItemIds.length) {
          if (wrap)
            wrap.innerHTML =
              '<p class="empty-state" style="padding:20px 0;">No menu sections are set to Kitchen yet. The owner can set this in the menu editor.</p>';
          return;
        }
        try {
          const { data, error } = await supabaseClient.rpc(
            "get_kitchen_orders_staff",
            {
              p_slug: MENU_SLUG,
              p_pin: sessionPin,
              p_item_ids: kitchenItemIds,
            },
          );
          if (error) throw error;
          // Belt and braces: if the server row includes item_id, make sure
          // no bar item slips onto this screen.
          const rows = (data || []).filter(
            (r) => r.item_id == null || kitchenItemIds.includes(String(r.item_id)),
          );
          renderOrdersList(rows);
        } catch (e) {
          console.error("Could not load orders:", e);
          if (wrap)
            wrap.innerHTML =
              '<p class="empty-state" style="padding:20px 0;">Could not load orders.</p>';
        }
      }

      function renderOrdersList(rows) {
        const wrap = document.getElementById("ordersListWrap");
        if (!wrap) return;
        if (!rows.length) {
          wrap.innerHTML =
            '<p class="empty-state" style="padding:20px 0;">No meals ordered right now.</p>';
          return;
        }
        const byTable = new Map();
        rows.forEach((r) => {
          if (!byTable.has(r.table_number)) byTable.set(r.table_number, []);
          byTable.get(r.table_number).push(r);
        });
        const tables = Array.from(byTable.keys()).sort((a, b) => {
          const na = parseFloat(a),
            nb = parseFloat(b);
          if (!isNaN(na) && !isNaN(nb)) return na - nb;
          return String(a).localeCompare(String(b));
        });
        wrap.innerHTML = tables
          .map((t) => {
            const items = byTable.get(t);
            const pendingCount = items.filter((i) => i.status === "pending").length;
            const groups = groupOrdersByOrderId(items);
            return `<div class="admin-section-card">
      <div class="section-heading" style="margin-bottom:10px; display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center;">
        <span style="flex-shrink:0;">Table ${escapeHtml(t)}</span>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          ${pendingCount ? `<span class="tab-badge">${pendingCount} pending</span>` : ""}
          <button class="btn btn-sm btn-danger clear-table-btn" type="button" data-table="${escapeHtml(t)}">Clear table</button>
        </div>
      </div>
      ${groups
        .map(
          (g) => `
        <div class="order-card">
          <div class="order-card-head order-card-head-row">
            <span>${new Date(g.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
          </div>
          ${g.items
            .map(
              (it) => `
        <div class="order-item-row ${it.status === "done" ? "done" : ""}">
          <span>${it.qty}× ${escapeHtml(it.item_name)}</span>
          <button class="btn btn-sm ${it.status === "done" ? "" : "btn-primary"}" onclick="toggleItemStatus('${it.id}','${it.status}')">${it.status === "done" ? "Undo" : "Mark done"}</button>
        </div>`,
            )
            .join("")}
          ${g.note ? `<p class="order-note">"${escapeHtml(g.note)}"</p>` : ""}
        </div>`,
        )
        .join("")}
    </div>`;
          })
          .join("");
        wrap.querySelectorAll(".clear-table-btn").forEach((btn) => {
          btn.onclick = () => clearTableOrders(btn.dataset.table);
        });
      }

      async function toggleItemStatus(itemId, currentStatus) {
        const newStatus = currentStatus === "done" ? "pending" : "done";
        try {
          const { data, error } = await supabaseClient.rpc(
            "set_item_status_staff",
            { p_slug: MENU_SLUG, p_pin: sessionPin, p_item_id: itemId, p_status: newStatus },
          );
          if (error || data !== true) throw error || new Error("rejected");
          refreshOrdersDashboard();
        } catch (e) {
          showToast("Could not update item");
        }
      }

      // Clearing on the kitchen screen only hides the table from THIS page —
      // the waiters and the bar still see the order and nothing is archived
      // or deleted. If the table orders more meals later, they show up.
      async function clearTableOrders(tableNumber) {
        const ok = confirm(`Remove Table ${tableNumber} from the kitchen screen?`);
        if (!ok) return;
        try {
          const { data, error } = await supabaseClient.rpc(
            "clear_kitchen_table_staff",
            { p_slug: MENU_SLUG, p_pin: sessionPin, p_table: tableNumber },
          );
          if (error || data !== true) throw error || new Error("rejected");
          showToast(`Table ${tableNumber} removed`);
          refreshOrdersDashboard();
        } catch (e) {
          showToast("Could not remove table");
        }
      }

      window.toggleItemStatus = toggleItemStatus;

      /* ---- activity log (owner only, enforced server-side too) ---- */

      const EDIT_LOG_ACTION_LABELS = {
        qty_change: "Qty changed",
        status_change: "Status changed",
        clear_table: "Table cleared",
        empty_trash: "Trash emptied",
        finish_table: "Table finished",
        bar_clear: "Bar cleared table",
        kitchen_clear: "Kitchen cleared table",
        empty_finished: "Report cleared",
      };

      function openActivity() {
        document.getElementById("activityOverlay").classList.remove("hidden");
        document.body.style.overflow = "hidden";
        renderActivity();
      }
      function closeActivity() {
        document.getElementById("activityOverlay").classList.add("hidden");
        document.body.style.overflow = "";
      }
      document.getElementById("activityOverlay").addEventListener("click", (e) => {
        if (e.target.id === "activityOverlay") closeActivity();
      });
      window.closeActivity = closeActivity;

      async function renderActivity() {
        const panel = document.getElementById("activityPanel");
        if (!panel) return;
        panel.innerHTML = `
    <div class="panel-header">
      <h2>Activity log</h2>
      <button class="icon-btn" onclick="closeActivity()">✕</button>
    </div>
    <div class="panel-scroll" id="activityScroll">
      <p class="empty-state" style="padding:20px 0;">Loading…</p>
    </div>`;
        try {
          const { data, error } = await supabaseClient.rpc("get_edit_log_staff", {
            p_slug: MENU_SLUG,
            p_pin: sessionPin,
          });
          if (error) throw error;
          renderActivityList(data || []);
        } catch (e) {
          const scroll = document.getElementById("activityScroll");
          if (scroll)
            scroll.innerHTML =
              '<p class="empty-state" style="padding:20px 0;">Could not load activity log.</p>';
        }
      }

      function renderActivityList(rows) {
        const scroll = document.getElementById("activityScroll");
        if (!scroll) return;
        if (!rows.length) {
          scroll.innerHTML = '<p class="empty-state" style="padding:20px 0;">No edits yet.</p>';
          return;
        }
        scroll.innerHTML = rows
          .map((r) => {
            const label = EDIT_LOG_ACTION_LABELS[r.action] || r.action;
            const who =
              r.role === "owner"
                ? "Owner"
                : r.role === "bartender"
                  ? "Bartender"
                  : r.role === "kitchen"
                    ? "Kitchen"
                    : "Waiter";
            const when = new Date(r.created_at).toLocaleString([], {
              month: "short",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            });
            const target = [
              r.table_number ? `Table ${escapeHtml(r.table_number)}` : "",
              r.item_name ? escapeHtml(r.item_name) : "",
            ]
              .filter(Boolean)
              .join(" · ");
            return `
      <div class="order-item-row" style="align-items:flex-start; flex-direction:column; gap:2px;">
        <div style="display:flex; justify-content:space-between; width:100%; gap:8px;">
          <strong>${label}</strong>
          <span style="color:var(--muted); font-size:12.5px; white-space:nowrap;">${when}</span>
        </div>
        <span style="color:var(--muted); font-size:13px;">${who}${target ? " · " + target : ""}${r.details ? " · " + escapeHtml(r.details) : ""}</span>
      </div>`;
          })
          .join("");
      }

      /* ---- wire up ---- */

      document.getElementById("unlockBtn").onclick = tryUnlock;
      document.getElementById("pinInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") tryUnlock();
      });
      document.getElementById("lockBtn").onclick = lockBoard;
      document.getElementById("activityBtn").onclick = openActivity;

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && sessionPin) {
          refreshOrdersDashboard();
        }
      });
      window.addEventListener("focus", () => {
        if (sessionPin) refreshOrdersDashboard();
      });

      if (restoreSession()) enterBoard();
    </script>
  </body>
</html>
