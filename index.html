      function getDeviceId() {
        let id;
        try {
          id = localStorage.getItem("deviceId");

        if (!id) {
          id = crypto.randomUUID
            ? crypto.randomUUID()

      async function loadVoteCounts() {
        try {
          const { data, error } = await supabaseClient.rpc("get_vote_counts", {
            p_slug: MENU_SLUG,
          });
          if (error) throw error;
          voteCounts = {};
          (data || []).forEach((r) => {
            voteCounts[r.item_id] = {
              likes: Number(r.likes) || 0,
              dislikes: Number(r.dislikes) || 0,
            };
          });
        } catch (e) {
          voteCounts = {};
        }
      }

      async function castVote(itemId, vote, btnEl) {
        if (getUserVote(itemId) === vote) return; // already voted this way — ignore repeat taps
        const row = btnEl.closest(".vote-row");
        if (!row || row.dataset.busy === "1") return; // request already in flight
        row.dataset.busy = "1";
        row.querySelectorAll(".vote-btn").forEach((b) => (b.disabled = true));
        try {
          const { data, error } = await supabaseClient.rpc("cast_vote", {
            p_slug: MENU_SLUG,
            p_item_id: itemId,
            p_device_id: getDeviceId(),
            p_vote: vote,
          });
          if (error) throw error;
          const result = Array.isArray(data) ? data[0] : data;
          voteCounts[itemId] = {
            likes: Number(result.likes) || 0,
            dislikes: Number(result.dislikes) || 0,
          };
          try {
            localStorage.setItem("vote:" + MENU_SLUG + ":" + itemId, vote);
          } catch (e) {}
          renderMenu();
        } catch (e) {
          showToast("Couldn't save your vote, try again");
          row.dataset.busy = "0";
          row
            .querySelectorAll(".vote-btn")
            .forEach((b) => (b.disabled = false));
        }
      }

      function fileToOptimizedBlob(file, maxDim = 700, quality = 0.75) {
        const hasAlpha =
          file.type === "image/png" ||
          file.type === "image/webp" ||
          file.type === "image/gif";
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("read failed"));
          reader.onload = (e) => {
            const img = new Image();
            img.onerror = () => reject(new Error("decode failed"));
            img.onload = () => {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round(height * (maxDim / width));
                  width = maxDim;
                } else {
                  width = Math.round(width * (maxDim / height));
                  height = maxDim;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              const mime = hasAlpha ? "image/png" : "image/jpeg";
              canvas.toBlob(
                (blob) =>
                  blob
                    ? resolve({
                        blob,
                        mime,
                      })
                    : reject(new Error("toBlob failed")),
                mime,
                quality,
              );
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function uploadItemImage(file, oldPath) {
        const { blob, mime } = await fileToOptimizedBlob(file);
        const ext = mime === "image/png" ? "png" : "jpg";
        const path = `${MENU_SLUG}/${uid("img")}.${ext}`;

        const { error: upErr } = await supabaseClient.storage
          .from(MENU_BUCKET)
          .upload(path, blob, {
            contentType: mime,
            cacheControl: "31536000",
            upsert: false,
          });
        if (upErr) throw upErr;

        const { data: signed, error: signErr } = await supabaseClient.storage
          .from(MENU_BUCKET)
          .createSignedUrl(path, SIGNED_URL_TTL);
        if (signErr) throw signErr;

        if (oldPath) {
          supabaseClient.storage
            .from(MENU_BUCKET)
            .remove([oldPath])
            .catch(() => {});
        }

        return {
          url: signed.signedUrl,
          path,
        };
      }
      async function migrateBase64Images() {
        let count = 0;
        for (const sec of state.sections || []) {
          for (const it of sec.items || []) {
            if (it.image && it.image.startsWith("data:")) {
              try {
                const resp = await fetch(it.image);
                const blob = await resp.blob();
                const ext = blob.type === "image/png" ? "png" : "jpg";
                const path = `${MENU_SLUG}/${uid("img")}.${ext}`;
                const { error: upErr } = await supabaseClient.storage
                  .from(MENU_BUCKET)
                  .upload(path, blob, {
                    contentType: blob.type,
                    cacheControl: "31536000",
                  });
                if (upErr) throw upErr;
                const { data: signed, error: signErr } =
                  await supabaseClient.storage
                    .from(MENU_BUCKET)
                    .createSignedUrl(path, SIGNED_URL_TTL);
                if (signErr) throw signErr;
                it.image = signed.signedUrl;
                it.imagePath = path;
                count++;
              } catch (e) {
                console.error("Migration failed for an item:", e);
              }
            }
          }
        }
        if (count > 0) {
          markDirty();
          renderAdmin();
          showToast(
            `Migrated ${count} photo(s) — click "Publish live" to save`,
          );
        } else {
          showToast("No embedded photos found");
        }
      }

      function uid(prefix) {
        return prefix + "_" + Math.random().toString(36).slice(2, 9);
      }

      function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str == null ? "" : String(str);
        return d.innerHTML;
      }

      async function loadData() {
        try {
          const { data, error } = await supabaseClient.rpc("get_menu", {
            p_slug: MENU_SLUG,

          if (error) throw error;
          state = data ? data : defaultData();
        } catch (e) {
          state = defaultData();
        }
        if (!state.sections) state.sections = [];
        activeSection = state.sections[0] ? state.sections[0].id : null;
        await loadVoteCounts();
        render();
        document.getElementById("app").classList.add("ready");
      }

      let dirty = false;

        dirty = true;
        updatePublishUI();
        render();

      function updatePublishUI() {
        const btn = document.getElementById("publishLiveBtn");
        const status = document.getElementById("publishStatus");
        if (btn) {
          btn.disabled = !dirty;
          btn.textContent = dirty ? "Publish live" : "Published";

        if (status) {
          status.textContent = dirty
            ? "You have unpublished changes"
            : "Everything is published";
          status.classList.toggle("dirty", dirty);

      async function publishLive() {
        const btn = document.getElementById("publishLiveBtn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Publishing…";
        }
        let approxKb = 0;
        try {
          // Rough size check — big base64 photos are the most common reason
          // a publish stalls out on a slow mobile connection.
          approxKb = Math.round(JSON.stringify(state).length / 1024);
          console.log("Publishing menu, approx payload size:", approxKb, "KB");

          const timeoutMs = 20000;
          const timeout = new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error("timeout after " + timeoutMs + "ms")),
              timeoutMs,
            ),
          );

          const { data, error } = await Promise.race([
            supabaseClient.rpc("save_menu", {
              p_slug: MENU_SLUG,
              p_pin: sessionPin,
              p_data: state,
            }),
            timeout,
          ]);
          if (error || data !== true) {
            console.error("Publish rejected:", error, data);
            throw new Error(error ? error.message || "rejected" : "rejected");
          }
          dirty = false;
          showToast("Published live (" + approxKb + " KB)");
        } catch (e) {
          console.error("Publish failed:", e);
          const isTimeout = String(e.message || "").includes("timeout");
          const detail = isTimeout
            ? "timed out after 20s, payload " + approxKb + " KB"
            : "error: " + (e.message || "unknown");
          showToast("Publish failed — " + detail, 6000);
        }
        updatePublishUI();
      }

      function renderTabs() {
        const tabs = document.getElementById("tabs");
        tabs.innerHTML = "";
        state.sections.forEach((sec) => {
          const b = document.createElement("button");
          b.className = "tab" + (sec.id === activeSection ? " active" : "");
          b.textContent = sec.title || "Untitled";
          b.dataset.sid = sec.id;
          b.onclick = () => selectSection(sec.id);
          tabs.appendChild(b);
        });
        updateTabArrows();
      }

      function selectSection(id) {
        activeSection = id;
        // Only toggle the active class instead of tearing down and
        // rebuilding every tab button — rebuilding on every tap was what
        // made the tabs feel janky, and it also meant the button being
        // tapped had already been removed from the DOM by the time we
        // tried to scroll it into view, so that scroll silently failed.
        document.querySelectorAll("#tabs .tab").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.sid === id);
        });
        renderMenu();
        const activeBtn = document.querySelector("#tabs .tab.active");
        if (activeBtn) {
          activeBtn.scrollIntoView({
            behavior: "smooth",
            inline: "center",
            block: "nearest",
          });
        }
      }

      function renderMenu() {
        const menu = document.getElementById("menu");
        const sec = state.sections.find((s) => s.id === activeSection);
        if (!sec) {
          menu.innerHTML =
            '<p class="empty-state">No sections yet. Open owner settings to add your first category.</p>';
          return;
        }
        const currency = state.business.currency || "$";
        let html = `<h3 class="section-heading">${escapeHtml(sec.title)}</h3>`;
        if (!sec.items || sec.items.length === 0) {
          html += '<p class="empty-state">No items in this section yet.</p>';
        } else {
          html += '<div class="items-grid">';
          sec.items.forEach((it) => {
            const badges = (it.tags || [])
              .map((t) =>
                TAG_META[t]
                  ? `<span class="badge" title="${TAG_META[t].title}">${TAG_META[t].label}</span>`
                  : "",
              )
              .join("");
            const priceHtml =
              it.available === false
                ? '<span class="sold-out-tag">Unavailable right now</span>'
                : currency + escapeHtml(it.price);
            const descHtml = it.description
              ? `<p class="item-desc">${escapeHtml(it.description)}</p>`
              : "";
            const mediaHtml = it.image
              ? `<button class="item-photo-thumb" type="button" aria-label="View photo" onclick="openPhoto('${escapeHtml(it.image)}', this)"><img src="${escapeHtml(it.image)}" alt="" loading="lazy"></button>`
              : "";

            const vc = voteCounts[it.id] || {
              likes: 0,
              dislikes: 0,
            };
            const total = vc.likes + vc.dislikes;
            const hasOverride =
              it.likePercent !== undefined &&
              it.likePercent !== null &&
              it.likePercent !== "";
            const percent = hasOverride
              ? Math.max(0, Math.min(100, Math.round(Number(it.likePercent))))
              : total > 0
                ? Math.round((vc.likes / total) * 100)
                : null;
            const userVote = getUserVote(it.id);
            const percentLabel =
              percent === null
                ? ""
                : `<span class="vote-percent">${percent}% liked</span>`;
            const voteRow = `
          <div class="vote-row" data-busy="0">
            <button class="vote-btn like ${userVote === "like" ? "active" : ""}" type="button" data-item="${it.id}" aria-label="Like this item" onclick="castVote('${it.id}','like',this)">👍</button>
            <button class="vote-btn dislike ${userVote === "dislike" ? "active" : ""}" type="button" data-item="${it.id}" aria-label="Dislike this item" onclick="castVote('${it.id}','dislike',this)">👎</button>
            ${percentLabel}
          </div>`;

            html += `
        <div class="item ${it.available === false ? "unavailable" : ""} ${it.image ? "" : "no-media"}">
          ${mediaHtml}
          <div class="item-body">
            <div class="item-top">
              <span class="item-name">${escapeHtml(it.name)}</span>
              <span class="item-badges">${badges}</span>
            </div>
            ${descHtml}
            <div class="item-foot">
              <span class="item-price">${priceHtml}</span>
            </div>
            ${voteRow}
          </div>
        </div>`;
          });
          html += "</div>";
        }
        menu.innerHTML = html;
      }

      function openPhoto(url, sourceEl) {
        const img = document.getElementById("photoLightboxImg");
        const box = document.getElementById("photoLightbox");
        img.src = url;
        box.classList.remove("hidden");
        if (sourceEl) {
          const r = sourceEl.getBoundingClientRect();
          const originX = r.left + r.width / 2;
          const originY = r.top + r.height / 2;
          img.style.transformOrigin = `${originX}px ${originY}px`;
        }
        requestAnimationFrame(() => box.classList.add("open"));
      }
      function closePhoto() {
        const box = document.getElementById("photoLightbox");
        box.classList.remove("open");
        setTimeout(() => box.classList.add("hidden"), 280);

          panel.innerHTML = `
      <div class="panel-header">

        <button class="icon-btn" onclick="closeAdmin()">✕</button>
      </div>
      <div class="panel-scroll">

            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
              return {
                offset,
                element: child,

            return closest;

        } else if (clientY > rect.bottom - edge) {
          speed = Math.ceil((clientY - (rect.bottom - edge)) / 4);

      function addSection() {
        const sec = {
          id: uid("s"),
          title: "New section",
          items: [],
        };
        state.sections.push(sec);
        if (!activeSection) activeSection = sec.id;
        markDirty();
        renderAdmin();
      }

      initAdminVisibility();
      loadData();
    </script>
  </body>
</html>
