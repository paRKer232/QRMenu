      function initAdminVisibility() {
        // Primary trigger: query param, e.g. mysite.com/qrmenu?owner=1
        // Fragments (#owner) are kept as a fallback, but iOS Safari's
        // address-bar autocomplete can silently drop hash fragments once
        // history.replaceState has stripped them once before, so the query
        // param is the more reliable way to grant access on mobile.
        let params;
        try {
          params = new URLSearchParams(window.location.search);
        } catch (e) {
          params = null;
        }
        const queryTriggered = !!params && params.get(ADMIN_HASH) !== null;
        const hashTriggered = window.location.hash === "#" + ADMIN_HASH;
        const staffQueryTriggered = !!params && params.get(STAFF_HASH) !== null;
        const staffHashTriggered = window.location.hash === "#" + STAFF_HASH;

        if (queryTriggered || hashTriggered) {
          try {
            localStorage.setItem(ADMIN_DEVICE_KEY, "1");
          } catch (e) {}
          // Strip the trigger from the address bar so it doesn't linger visibly.
          if (queryTriggered && params) {
            params.delete(ADMIN_HASH);
            const qs = params.toString();
            history.replaceState(
              null,
              "",
              window.location.pathname + (qs ? "?" + qs : ""),
            );
          } else {
            history.replaceState(
              null,
              "",
              window.location.pathname + window.location.search,
            );
          }
        }
        if (staffQueryTriggered || staffHashTriggered) {
          try {
            localStorage.setItem(STAFF_DEVICE_KEY, "1");
          } catch (e) {}
          if (staffQueryTriggered && params) {
            params.delete(STAFF_HASH);
            const qs = params.toString();
            history.replaceState(
              null,
              "",
              window.location.pathname + (qs ? "?" + qs : ""),
            );
          } else {
            history.replaceState(
              null,
              "",
              window.location.pathname + window.location.search,
            );
          }
        }
        isAdminDevice = false;
        try {
          isAdminDevice = localStorage.getItem(ADMIN_DEVICE_KEY) === "1";
        } catch (e) {}
        isStaffDevice = false;
        try {
          isStaffDevice = localStorage.getItem(STAFF_DEVICE_KEY) === "1";
        } catch (e) {}
        const fab = document.getElementById("adminToggle");
        if (fab) fab.classList.toggle("hidden", !isAdminDevice);
        const ordersFab = document.getElementById("ordersToggle");
        if (ordersFab)
          ordersFab.classList.toggle("hidden", !(isAdminDevice || isStaffDevice));
        if (isAdminDevice || isStaffDevice) initOrdersBadge();
      }

      // Fallback recovery gesture for mobile: tap the footer copyright text
      // 5 times within 2 seconds to re-grant admin access on this device,
      // without needing to type any URL at all.
      function initFooterRecoveryTap() {
        const el = document.getElementById("copyrightText");
        if (!el) return;
        let tapCount = 0;
        let tapTimer = null;
        el.addEventListener("click", () => {
          tapCount++;
          if (tapTimer) clearTimeout(tapTimer);
          tapTimer = setTimeout(() => {
            tapCount = 0;
          }, 2000);
          if (tapCount >= 5) {
            tapCount = 0;
            if (tapTimer) clearTimeout(tapTimer);
            try {
              localStorage.setItem(ADMIN_DEVICE_KEY, "1");
            } catch (e) {}
            initAdminVisibility();
            showToast("Admin access restored on this device");
          }
        });
      }

      function getDeviceId() {
        let id;
        try {
          id = localStorage.getItem("deviceId");

        if (!id) {
          id = crypto.randomUUID
            ? crypto.randomUUID()
            : "d-" + Date.now() + "-" + Math.random().toString(36).slice(2);
          try {

      async function loadVoteCounts() {
        try {
          const { data, error } = await supabaseClient.rpc("get_vote_counts", {
            p_slug: MENU_SLUG,
          });
          if (error) throw error;
          voteCounts = {};
          (data || []).forEach((r) => {
            voteCounts[r.item_id] = {
              likes: Number(r.likes) || 0,
              dislikes: Number(r.dislikes) || 0,
            };
          });
        } catch (e) {
          voteCounts = {};
        }
      }

      async function castVote(itemId, vote, btnEl) {
        if (getUserVote(itemId) === vote) return; // already voted this way — ignore repeat taps
        const row = btnEl.closest(".vote-row");
        if (!row || row.dataset.busy === "1") return; // request already in flight
        row.dataset.busy = "1";
        row.querySelectorAll(".vote-btn").forEach((b) => (b.disabled = true));
        try {
          const { data, error } = await supabaseClient.rpc("cast_vote", {
            p_slug: MENU_SLUG,
            p_item_id: itemId,
            p_device_id: getDeviceId(),
            p_vote: vote,
          });
          if (error) throw error;
          const result = Array.isArray(data) ? data[0] : data;
          voteCounts[itemId] = {
            likes: Number(result.likes) || 0,
            dislikes: Number(result.dislikes) || 0,
          };
          try {
            localStorage.setItem("vote:" + MENU_SLUG + ":" + itemId, vote);
          } catch (e) {}
          renderMenu();
        } catch (e) {
          showToast("Couldn't save your vote, try again");
          row.dataset.busy = "0";
          row
            .querySelectorAll(".vote-btn")
            .forEach((b) => (b.disabled = false));
        }
      }

      function openCallWaiter() {
        document.getElementById("callOverlay").classList.remove("hidden");
        scrollLockY = window.scrollY;
        document.body.style.overflow = "hidden";
        document.body.style.touchAction = "none";
        renderCallWaiterPanel();

      function closeCallWaiter() {
        document.getElementById("callOverlay").classList.add("hidden");
        document.body.style.overflow = "";
        document.body.style.touchAction = "";
        window.scrollTo(0, scrollLockY);
      }
      function renderCallWaiterPanel() {
        const panel = document.getElementById("callPanel");
        if (!panel) return;
        const count = Math.max(
          1,
          parseInt((state.business && state.business.tableCount) || 12, 10) ||
            12,
        );
        let grid = "";
        for (let i = 1; i <= count; i++) {
          const active =
            String(i) === String(callWaiterTable) ? " active" : "";
          grid += `<button class="table-btn${active}" type="button" onclick="pickCallWaiterTable('${i}')">${i}</button>`;
        }
        panel.innerHTML = `
    <div class="panel-header">
      <h2>Извикай сервитьор</h2>
      <button class="icon-btn" onclick="closeCallWaiter()">✕</button>
    </div>
    <div class="panel-scroll">
      <p class="cart-table-picker-label" style="margin-bottom:10px;">На коя маса сядате?</p>
      <div class="table-grid">${grid}</div>
      <div class="table-gate-other">
        <input type="text" id="callOtherTableInput" placeholder="Други..." value="${escapeHtml(callWaiterTable && !(parseInt(callWaiterTable, 10) >= 1 && parseInt(callWaiterTable, 10) <= count) ? callWaiterTable : "")}">
        <button class="btn btn-primary" type="button" onclick="pickOtherCallWaiterTable()">Go</button>

      </div>
      <button class="btn btn-primary btn-block" id="callWaiterSendBtn" onclick="sendCallWaiter()">Извикай сервитьор</button>
    </div>`;
      }

      async function sendCallWaiter() {
        if (!callWaiterTable) {
          showToast("Please choose your table first");
          return;
        }
        const msgInput = document.getElementById("callWaiterMessage");
        const message = msgInput ? msgInput.value.trim() : "";
        const btn = document.getElementById("callWaiterSendBtn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Sending…";
        }
        try {
          const { error } = await supabaseClient.rpc("request_service", {
            p_slug: MENU_SLUG,
            p_table: callWaiterTable,
            p_message: message || null,
          });
          if (error) throw error;
          try {
            localStorage.setItem(callTableStorageKey(), callWaiterTable);
          } catch (e) {}
          showToast("Извикахте сервитьор!");
          closeCallWaiter();
        } catch (e) {
          console.error("Call waiter failed:", e);
          showToast("Could not reach staff, try again");
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Извикай сервитьор";
          }
        }
      }

      /* ---- table picker (staff: pick a table to start taking an order) ---- */

      function staffTableGridHtml() {
        const count = Math.max(
          1,
          parseInt((state.business && state.business.tableCount) || 12, 10) ||
            12,
        );
        let grid = "";
        for (let i = 1; i <= count; i++) {
          const t = String(i);
          const tableCart = cartsByTable[t];
          const pendingQty = tableCart
            ? tableCart.items.reduce((s, c) => s + c.qty, 0)
            : 0;
          const active =
            staffOrderMode && t === String(selectedTable) ? " active" : "";
          const occupied = pendingQty > 0 ? " occupied" : "";
          const badge =
            pendingQty > 0
              ? `<span class="table-btn-badge pending">${pendingQty}</span>`
              : "";
          grid += `<button class="table-btn${active}${occupied}" type="button" onclick="startTakingOrder('${i}')">${i}${badge}</button>`;
        }
        return grid;
      }
      function startTakingOrderOther() {
        const input = document.getElementById("ordersOtherTableInput");
        const val = input ? input.value.trim() : "";
        if (!val) {
          showToast("Enter a table name first");
          return;
        }
        startTakingOrder(val);
      }

      // Staff picks a table from the Live Orders panel to start (or resume)
      // building an order for it. This switches the underlying menu into
      // "add to order" mode so they can tap items to add them. Tables are
      // independent — picking a different table never touches another
      // table's unsent items, so a waiter can freely bounce between several
      // tables mid-order.
      function startTakingOrder(t) {
        t = String(t);
        selectedTable = t;
        staffOrderMode = true;
        myOrders = [];
        updateTablePill();
        document.getElementById("cartFab").classList.remove("hidden");
        document.getElementById("callWaiterFab").classList.add("hidden");
        updateCartFab();
        render();
        loadMyOrders();
        closeOrders();
      }

      // Steps back to the Live Orders table grid. The current table's
      // unsent cart (if any) is kept as-is so the waiter can pick it back
      // up later — only placeOrder() clears a table's cart.
      function finishTakingOrder() {
        staffOrderMode = false;
        selectedTable = null;
        myOrders = [];
        document.getElementById("cartFab").classList.add("hidden");
        updateTablePill();
        render();
        closeCart();
        if (!getOwnerObserverMode()) {
          document.getElementById("callWaiterFab").classList.remove("hidden");
        }
        openOrders();
      }

      function updateTablePill() {
        const pill = document.getElementById("tablePill");
        if (!pill) return;
        if (staffOrderMode && selectedTable) {
          pill.textContent = "Taking order — Маса " + selectedTable;
          pill.classList.remove("hidden");
        } else {
          pill.classList.add("hidden");
        }
      }

      /* ---- cart (staff order-in-progress) ---- */

      // Returns (creating if needed) the unsent cart for whichever table is
      // currently selected. Every cart read/write goes through this so each
      // table's in-progress items stay independent of the others.
      function activeCart() {
        if (!selectedTable) return { items: [], note: "" };
        if (!cartsByTable[selectedTable]) {
          cartsByTable[selectedTable] = { items: [], note: "" };
        }
        return cartsByTable[selectedTable];
      }

      function cartQty(itemId) {
        const line = activeCart().items.find((c) => c.item_id === itemId);
        return line ? line.qty : 0;
      }
      function cartCtrlHtml(itemId) {
        const q = cartQty(itemId);
        if (q <= 0) {
          return `<button class="add-btn" type="button" onclick="addToCart('${itemId}')">+ Добави</button>`;
        }
        return `<div class="qty-stepper">
    <button type="button" aria-label="Remove one" onclick="decCartItem('${itemId}')">−</button>
    <span>${q}</span>
    <button type="button" aria-label="Add one" onclick="addToCart('${itemId}')">+</button>
  </div>`;
      }
      let lastCartTapAt = {};
      function cartTapAllowed(key) {
        const now = Date.now();
        if (lastCartTapAt[key] && now - lastCartTapAt[key] < 350) {
          return false;
        }
        lastCartTapAt[key] = now;
        return true;
      }

      function addToCart(itemId) {
        if (!staffOrderMode) return;
        if (!cartTapAllowed("add:" + itemId)) return;
        const item = findMenuItem(itemId);
        if (!item || item.available === false) return;
        const items = activeCart().items;
        const line = items.find((c) => c.item_id === itemId);
        if (line) line.qty++;
        else
          items.push({
            item_id: itemId,
            name: item.name,
            price: item.price,
            qty: 1,
          });
        refreshCartUI();
      }
      function decCartItem(itemId) {
        if (!staffOrderMode) return;
        if (!cartTapAllowed("dec:" + itemId)) return;
        const items = activeCart().items;
        const idx = items.findIndex((c) => c.item_id === itemId);
        if (idx === -1) return;
        items[idx].qty--;
        if (items[idx].qty <= 0) items.splice(idx, 1);
        refreshCartUI();
      }
      function refreshCartUI() {
        document.querySelectorAll("[data-cart-item]").forEach((el) => {
          el.innerHTML = cartCtrlHtml(el.dataset.cartItem);
        });
        updateCartFab();
        const overlay = document.getElementById("cartOverlay");
        if (overlay && !overlay.classList.contains("hidden")) {
          renderCartPanel();
        }
      }
      function updateCartFab() {
        const totalQty = activeCart().items.reduce((s, c) => s + c.qty, 0);
        const badge = document.getElementById("cartBadge");
        if (!badge) return;
        if (totalQty > 0) {
          badge.textContent = totalQty;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      }

      /* ---- editing an order after it's already been sent ---- */
      // An order goes to the kitchen the moment "Поръчай" is pressed — no
      // more waiting. To fix a mistake after that, a waiter presses "Edit"
      // on that specific order, which opens it for correction and starts a
      // 15-minute window (only from that point, not from when it was sent).
      // Once the window closes — or the waiter taps "Done" — it locks again
      // until Edit is pressed again.
      const ORDER_EDIT_MINUTES = 15;
      let editingOrders = {}; // order_id -> edit-window deadline (ms epoch)
      let editingTimers = {}; // order_id -> setTimeout id that auto-closes editing
      let editCountdownInterval = null; // ticks the "closes in mm:ss" text

      function formatCountdown(ms) {
        const totalSec = Math.max(0, Math.ceil(ms / 1000));
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return m + ":" + String(s).padStart(2, "0");
      }
      function startEditingOrder(orderId) {
        editingOrders[orderId] = Date.now() + ORDER_EDIT_MINUTES * 60 * 1000;
        if (editingTimers[orderId]) clearTimeout(editingTimers[orderId]);
        editingTimers[orderId] = setTimeout(
          () => stopEditingOrder(orderId),
          ORDER_EDIT_MINUTES * 60 * 1000,
        );
        rerenderOrderViews();
        startEditCountdownTicker();
      }
      function stopEditingOrder(orderId) {
        delete editingOrders[orderId];
        if (editingTimers[orderId]) {
          clearTimeout(editingTimers[orderId]);
          delete editingTimers[orderId];
        }
        rerenderOrderViews();
      }
      function rerenderOrderViews() {
        const cartOverlay = document.getElementById("cartOverlay");
        if (cartOverlay && !cartOverlay.classList.contains("hidden")) {
          renderCartPanel();
        }
        const ordersOverlay = document.getElementById("ordersOverlay");
        if (ordersOverlay && !ordersOverlay.classList.contains("hidden")) {
          refreshOrdersDashboard();
        }
      }
      function startEditCountdownTicker() {
        stopEditCountdownTicker();
        editCountdownInterval = setInterval(() => {
          let any = false;
          document.querySelectorAll("[data-order-countdown]").forEach((el) => {
            const deadline = editingOrders[el.dataset.orderCountdown];
            if (deadline) {
              any = true;
              el.textContent = formatCountdown(deadline - Date.now());
            }
          });
          if (!any) stopEditCountdownTicker();
        }, 1000);
      }
      function stopEditCountdownTicker() {
        if (editCountdownInterval) {
          clearInterval(editCountdownInterval);
          editCountdownInterval = null;
        }
      }
      // Adjusts the quantity of an item that's already been sent to the
      // kitchen (only reachable while its order is in edit mode). Setting
      // qty to 0 removes the item. Requires a `set_order_item_qty_staff`
      // RPC on the backend — see the accompanying SQL note.
      async function adjustSentItemQty(itemId, currentQty, delta, view) {
        const newQty = currentQty + delta;
        try {
          const { data, error } = await supabaseClient.rpc(
            "set_order_item_qty_staff",
            {
              p_slug: MENU_SLUG,
              p_pin: sessionPinOrders,
              p_item_id: itemId,
              p_qty: newQty,
            },
          );
          if (error || data !== true) throw error || new Error("rejected");
        } catch (e) {
          console.error("Could not update sent item:", e);
          showToast("Could not update that item");
          return;
        }
        if (view === "cart") {
          await loadMyOrders();
          renderCartPanel();
        } else {
          refreshOrdersDashboard();
        }
      }
      // Shared markup for one already-sent order's items, with an Edit /
      // Done toggle and (while editing) per-item qty steppers in place of
      // the normal status badge or "Mark done" control.
      function sentOrderCardHtml(g, view, statusControl) {
        const anyPending = g.items.some((it) => it.status !== "done");
        const editing = !!editingOrders[g.order_id];
        const editBtn = anyPending
          ? editing
            ? `<button class="btn btn-sm" type="button" onclick="stopEditingOrder('${g.order_id}')">Done</button>`
            : `<button class="btn btn-sm" type="button" onclick="startEditingOrder('${g.order_id}')">Edit</button>`
          : "";
        const countdown = editing
          ? ` · closes in <span data-order-countdown="${g.order_id}">${formatCountdown(editingOrders[g.order_id] - Date.now())}</span>`
          : "";
        const itemsHtml = g.items
          .map((it) => {
            if (editing && it.status !== "done") {
              return `
        <div class="order-item-row">
          <span>${escapeHtml(it.item_name)}</span>
          <div class="qty-stepper">
            <button type="button" aria-label="Remove one" onclick="adjustSentItemQty('${it.id}', ${it.qty}, -1, '${view}')">−</button>
            <span>${it.qty}</span>
            <button type="button" aria-label="Add one" onclick="adjustSentItemQty('${it.id}', ${it.qty}, 1, '${view}')">+</button>
          </div>
        </div>`;
            }
            return `
        <div class="order-item-row ${it.status === "done" ? "done" : ""}">
          <span>${it.qty}× ${escapeHtml(it.item_name)}</span>
          ${statusControl(it)}
        </div>`;
          })
          .join("");
        return { editBtn, countdown, itemsHtml };
      }

      function groupOrdersByOrderId(rows) {
        const map = new Map();
        rows.forEach((r) => {
          if (!map.has(r.order_id)) {
            map.set(r.order_id, {
              order_id: r.order_id,
              created_at: r.created_at,
              note: r.note,
              items: [],
            });
          }
          map.get(r.order_id).items.push(r);
        });
        return Array.from(map.values()).sort(
          (a, b) => new Date(b.created_at) - new Date(a.created_at),
        );
      }

      function openCart() {
        document.getElementById("cartOverlay").classList.remove("hidden");
        scrollLockY = window.scrollY;
        document.body.style.overflow = "hidden";
        document.body.style.touchAction = "none";
        renderCartPanel();
        loadMyOrders().then(renderCartPanel);
      }
      function closeCart() {
        document.getElementById("cartOverlay").classList.add("hidden");
        document.body.style.overflow = "";
        document.body.style.touchAction = "";
        window.scrollTo(0, scrollLockY);
      }

      function renderCartPanel() {
        const panel = document.getElementById("cartPanel");
        if (!panel) return;
        const currency = (state.business && state.business.currency) || "$";
        const ac = activeCart();
        let cartHtml = "";
        if (!ac.items.length) {
          cartHtml =
            '<p class="empty-state" style="padding:20px 0;">Количката ви е празна. Докоснете "+ Добави" на продукт от менюто за да я добавите в количката.</p>';
        } else {
          const total = ac.items.reduce(
            (s, c) => s + (parseFloat(c.price) || 0) * c.qty,
            0,
          );
          cartHtml =
            '<div class="cart-lines">' +
            ac.items
              .map(
                (c) => `
      <div class="cart-line">
        <div class="cart-line-info">
          <span class="cart-line-name">${escapeHtml(c.name)}</span>
          <span class="cart-line-price">${currency}${(parseFloat(c.price) || 0).toFixed(2)}</span>
        </div>
        <div class="qty-stepper">
          <button type="button" aria-label="Remove one" onclick="decCartItem('${c.item_id}')">−</button>
          <span>${c.qty}</span>
          <button type="button" aria-label="Add one" onclick="addToCart('${c.item_id}')">+</button>
        </div>
      </div>`,
              )
              .join("") +
            "</div>" +
            `<div class="field"><label>Бележка за кухнята (по избор)</label><textarea id="cartNoteInput" placeholder="например - без лук">${escapeHtml(ac.note)}</textarea></div>` +
            `<div class="cart-total-row"><span>Total</span><span class="cart-total">${currency}${total.toFixed(2)}</span></div>` +
            `<button class="btn btn-primary btn-block" id="placeOrderBtn" onclick="placeOrder()">Поръчай</button>`;
        }

        let sentHtml = "";
        if (myOrders.length) {
          sentHtml =
            `<div class="divider"></div><div class="section-heading" style="margin-bottom:10px;">Sent to the kitchen</div>` +
            groupOrdersByOrderId(myOrders)
              .map((g) => {
                const { editBtn, countdown, itemsHtml } = sentOrderCardHtml(
                  g,
                  "cart",
                  (it) =>
                    `<span class="status-badge ${it.status}">${it.status === "done" ? "Ready" : "Preparing"}</span>`,
                );
                return `
      <div class="order-card">
        <div class="order-card-head order-card-head-row">
          <span>${new Date(g.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}${countdown}</span>
          ${editBtn}
        </div>
        ${itemsHtml}
        ${g.note ? `<p class="order-note">"${escapeHtml(g.note)}"</p>` : ""}
      </div>`;
              })
              .join("");
        }

        panel.innerHTML = `
    <div class="panel-header">
      <h2>Table ${escapeHtml(selectedTable || "")}</h2>
      <button class="icon-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="panel-scroll">
      ${cartHtml}
      ${sentHtml}
      <div class="divider"></div>
      <button class="btn btn-block" onclick="finishTakingOrder()">Finish — back to Live orders</button>
    </div>`;

        const noteInput = document.getElementById("cartNoteInput");
        if (noteInput) {
          noteInput.onchange = () => {
            activeCart().note = noteInput.value;
          };
        }
        if (Object.keys(editingOrders).length) startEditCountdownTicker();
      }

      async function placeOrder() {
        const ac = activeCart();
        if (!ac.items.length || !selectedTable) return;
        const btn = document.getElementById("placeOrderBtn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Placing order…";
        }
        try {
          const { error } = await supabaseClient.rpc("place_order", {
            p_slug: MENU_SLUG,
            p_pin: sessionPinOrders,
            p_table: selectedTable,
            p_items: ac.items.map((c) => ({
              item_id: c.item_id,
              name: c.name,
              price: c.price,
              qty: c.qty,
            })),
            p_note: ac.note ? ac.note.trim() : null,
          });
          if (error) throw error;
          delete cartsByTable[selectedTable];
          refreshCartUI();
          showToast("Изпратено в кухнята!");
          await loadMyOrders();
          renderCartPanel();
        } catch (e) {
          console.error("Order failed:", e);
          showToast("Could not send the order, try again");
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Поръчай";
          }
        }
      }

      async function loadMyOrders() {
        if (!selectedTable) {
          myOrders = [];
          return;
        }
        try {
          const { data, error } = await supabaseClient.rpc(
            "get_table_orders",
            { p_slug: MENU_SLUG, p_pin: sessionPinOrders, p_table: selectedTable },
          );
          if (error) throw error;
          myOrders = data || [];
        } catch (e) {
          console.error("Грешка:", e);
        }
      }

      /* ---- staff live-orders dashboard ---- */

      function openOrders() {
        document.getElementById("ordersOverlay").classList.remove("hidden");
        scrollLockY = window.scrollY;
        document.body.style.overflow = "hidden";
        document.body.style.touchAction = "none";
        renderOrders();
      }
      function closeOrders() {
        document.getElementById("ordersOverlay").classList.add("hidden");
        document.body.style.overflow = "";
        document.body.style.touchAction = "";
        window.scrollTo(0, scrollLockY);
        unsubscribeStaffOrders();
        unsubscribeServiceRequests();
      }

      function renderOrders() {
        const panel = document.getElementById("ordersPanel");
        if (!panel) return;
        if (!unlockedOrders) {
          panel.innerHTML = `
      <div class="panel-header">
        <h2>Live orders</h2>
        <button class="icon-btn" onclick="closeOrders()">✕</button>
      </div>
      <div class="panel-scroll">
        <div class="lock-screen">
          <p style="color:var(--muted); font-size:13.5px;">Enter your staff PIN to view live orders.</p>
          <div class="field" style="max-width:180px; margin:14px auto;">
            <input type="text" inputmode="numeric" maxlength="6" id="ordersPinInput" placeholder="••••••">
          </div>
          <button class="btn btn-primary" onclick="tryUnlockOrders()">Unlock</button>
        </div>
      </div>`;
          return;
        }
        const exitLink = isAdminDevice
          ? getOwnerObserverMode()
            ? `<button class="orders-exit-observer" type="button" onclick="exitOwnerObserverMode()">Switch to table mode</button>`
            : `<button class="orders-exit-observer" type="button" onclick="enableOwnerObserverMode()">👀 Always open orders here</button>`
          : "";
        const activityBtn =
          staffRole === "owner"
            ? `<button class="icon-btn" type="button" onclick="openActivity()" title="Activity log" aria-label="Activity log">🕘</button>`
            : "";
        const finishedBtn =
          staffRole === "owner"
            ? `<button class="icon-btn" type="button" onclick="openFinished()" title="Finished tables (daily report)" aria-label="Finished tables">💰</button>`
            : "";
        panel.innerHTML = `
    <div class="panel-header">
      <h2>Live orders</h2>
      <div style="display:flex; align-items:center; gap:6px;">
        ${finishedBtn}
        ${activityBtn}
        <button class="icon-btn" type="button" onclick="openTrash()" title="Trash" aria-label="Trash">🗑</button>
        <button class="icon-btn" onclick="closeOrders()">✕</button>
      </div>
    </div>
    ${exitLink}
    <div class="panel-scroll" id="ordersScroll">
      <div class="admin-section-card" id="serviceRequestsCard" style="display:none;">
        <div class="section-heading" style="margin-bottom:10px;">🔔 Calling for a waiter</div>
        <div id="serviceRequestsList"></div>
      </div>
      <div class="admin-section-card">
        <div class="section-heading" style="margin-bottom:10px;">Take an order</div>
        <div class="table-grid">${staffTableGridHtml()}</div>
        <div class="table-gate-other">
          <input type="text" id="ordersOtherTableInput" placeholder="Други...">
          <button class="btn btn-primary" type="button" onclick="startTakingOrderOther()">Go</button>
        </div>
      </div>
      <div class="divider"></div>
      <div id="ordersListWrap">
        <p class="empty-state" style="padding:20px 0;">Loading…</p>
      </div>
    </div>`;
        subscribeStaffOrders();
        subscribeServiceRequests();
        refreshOrdersDashboard();
        refreshServiceRequests();
      }

      function pinErrorMessage(e, fallback) {
        const msg = e && e.message ? String(e.message) : "";
        const m = msg.match(/PIN_LOCKED:(\d+)/);
        if (m) {
          const secs = parseInt(m[1], 10);
          const mins = Math.ceil(secs / 60);
          return "Too many attempts — try again in " + mins + " min";
        }
        return fallback;
      }

      // Accepts either the owner PIN or a waiter PIN. check_staff_pin is a
      // new RPC (see the SQL migration) that returns 'owner', 'waiter', or
      // null — it never touches the existing owner-only check_pin/change_pin
      // used by the menu editor, so that stays owner-exclusive automatically.
      async function tryUnlockOrders() {
        const input = document.getElementById("ordersPinInput");
        const val = input ? input.value.trim() : "";
        try {
          const { data, error } = await supabaseClient.rpc(
            "check_staff_pin",
            { p_slug: MENU_SLUG, p_pin: val },
          );
          if (error) throw error;
          if (data === "owner" || data === "waiter") {
            sessionPinOrders = val;
            staffRole = data;
            unlockedOrders = true;
            try {
              sessionStorage.setItem(
                ORDERS_SESSION_KEY,
                JSON.stringify({ pin: val, role: data }),
              );
            } catch (e) {}
            renderOrders();
            refreshOrdersBadge();
          } else {
            showToast("Incorrect PIN");
          }
        } catch (e) {
          showToast(pinErrorMessage(e, "Could not verify PIN — check connection"));
        }
      }

      async function refreshOrdersDashboard() {
        try {
          const { data, error } = await supabaseClient.rpc(
            "get_active_orders_staff",
            { p_slug: MENU_SLUG, p_pin: sessionPinOrders },
          );
          if (error) throw error;
          renderOrdersList(data || []);
        } catch (e) {
          console.error("Could not load orders:", e);
          const scroll = document.getElementById("ordersListWrap");
          if (scroll)
            scroll.innerHTML =
              '<p class="empty-state" style="padding:20px 0;">Could not load orders.</p>';
        }
      }

      function renderOrdersList(rows) {
        const scroll = document.getElementById("ordersListWrap");
        if (!scroll) return;
        if (!rows.length) {
          scroll.innerHTML =
            '<p class="empty-state" style="padding:20px 0;">No active orders right now.</p>';
          return;
        }
        const byTable = new Map();
        rows.forEach((r) => {
          if (!byTable.has(r.table_number)) byTable.set(r.table_number, []);
          byTable.get(r.table_number).push(r);
        });
        const tables = Array.from(byTable.keys()).sort((a, b) => {
          const na = parseFloat(a),
            nb = parseFloat(b);
          if (!isNaN(na) && !isNaN(nb)) return na - nb;
          return String(a).localeCompare(String(b));
        });
        scroll.innerHTML = tables
          .map((t) => {
            const items = byTable.get(t);
            const pendingCount = items.filter(
              (i) => i.status === "pending",
            ).length;
            const groups = groupOrdersByOrderId(items);

      function fileToOptimizedBlob(file, maxDim = 700, quality = 0.75) {
        const hasAlpha =
          file.type === "image/png" ||
          file.type === "image/webp" ||
          file.type === "image/gif";
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("read failed"));
          reader.onload = (e) => {
            const img = new Image();
            img.onerror = () => reject(new Error("decode failed"));
            img.onload = () => {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round(height * (maxDim / width));
                  width = maxDim;
                } else {
                  width = Math.round(width * (maxDim / height));
                  height = maxDim;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              const mime = hasAlpha ? "image/png" : "image/jpeg";
              canvas.toBlob(
                (blob) =>
                  blob
                    ? resolve({
                        blob,
                        mime,
                      })
                    : reject(new Error("toBlob failed")),
                mime,
                quality,
              );
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function uploadItemImage(file, oldPath) {
        const { blob, mime } = await fileToOptimizedBlob(file);
        const ext = mime === "image/png" ? "png" : "jpg";
        const path = `${MENU_SLUG}/${uid("img")}.${ext}`;

        const { error: upErr } = await supabaseClient.storage
          .from(MENU_BUCKET)
          .upload(path, blob, {
            contentType: mime,
            cacheControl: "31536000",
            upsert: false,
          });
        if (upErr) throw upErr;

        const { data: signed, error: signErr } = await supabaseClient.storage
          .from(MENU_BUCKET)
          .createSignedUrl(path, SIGNED_URL_TTL);
        if (signErr) throw signErr;

        if (oldPath) {
          supabaseClient.storage
            .from(MENU_BUCKET)
            .remove([oldPath])
            .catch(() => {});
        }

        return {
          url: signed.signedUrl,
          path,
        };
      }
      async function migrateBase64Images() {
        let count = 0;
        for (const sec of state.sections || []) {
          const allSubsections = sec.subsections || [
            { items: sec.items || [] },
          ];
          for (const sub of allSubsections) {
            for (const it of sub.items || []) {
              if (it.image && it.image.startsWith("data:")) {
                try {
                  const resp = await fetch(it.image);
                  const blob = await resp.blob();
                  const ext = blob.type === "image/png" ? "png" : "jpg";
                  const path = `${MENU_SLUG}/${uid("img")}.${ext}`;
                  const { error: upErr } = await supabaseClient.storage
                    .from(MENU_BUCKET)
                    .upload(path, blob, {
                      contentType: blob.type,
                      cacheControl: "31536000",
                    });
                  if (upErr) throw upErr;
                  const { data: signed, error: signErr } =
                    await supabaseClient.storage
                      .from(MENU_BUCKET)
                      .createSignedUrl(path, SIGNED_URL_TTL);
                  if (signErr) throw signErr;
                  it.image = signed.signedUrl;
                  it.imagePath = path;
                  count++;
                } catch (e) {
                  console.error("Migration failed for an item:", e);
                }
              }
            }
          }
        }
        if (count > 0) {
          markDirty();
          renderAdmin();
          showToast(
            `Migrated ${count} photo(s) — click "Publish live" to save`,
          );
        } else {
          showToast("No embedded photos found");
        }
      }

      function uid(prefix) {
        return prefix + "_" + Math.random().toString(36).slice(2, 9);

      function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str == null ? "" : String(str);

      // Keep older saved menus working while adding nested menu subsections.
      // A legacy section with direct items becomes one "General" subsection.
      function normalizeMenuSections() {
        if (!state.sections) state.sections = [];
        state.sections = state.sections.map((sec) => {
          if (!Array.isArray(sec.subsections)) {
            sec.subsections = [
              {
                id: uid("ss"),
                title: "General",
                items: Array.isArray(sec.items) ? sec.items : [],
              },
            ];
            delete sec.items;
          }
          sec.subsections = sec.subsections.map((sub) => ({
            id: sub.id || uid("ss"),
            title: sub.title || "General",
            items: Array.isArray(sub.items) ? sub.items : [],
          }));
          if (!sec.subsections.length) {
            sec.subsections.push({
              id: uid("ss"),
              title: "General",
              items: [],
            });
          }
          return sec;
        });
      }

          data = result.data;

          renderLoadError();

        // No error, but no row for this slug yet — genuinely a fresh/unconfigured

        state = data ? data : defaultData();
        normalizeMenuSections();

      async function publishLive() {
        const btn = document.getElementById("publishLiveBtn");
        if (btn) {

        }
        let approxKb = 0;
        try {
          // Rough size check — big base64 photos are the most common reason
          // a publish stalls out on a slow mobile connection.
          approxKb = Math.round(JSON.stringify(state).length / 1024);
          console.log("Publishing menu, approx payload size:", approxKb, "KB");

          const timeoutMs = 20000;
          const timeout = new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error("timeout after " + timeoutMs + "ms")),
              timeoutMs,
            ),
          );

          const { data, error } = await Promise.race([
            supabaseClient.rpc("save_menu", {
              p_slug: MENU_SLUG,
              p_pin: sessionPinAdmin,
              p_data: state,
            }),
            timeout,
          ]);
          if (error || data !== true) {
            console.error("Publish rejected:", error, data);
            throw new Error(error ? error.message || "rejected" : "rejected");
          }
          dirty = false;
          showToast("Published live (" + approxKb + " KB)");
        } catch (e) {
          console.error("Publish failed:", e);
          const isTimeout = String(e.message || "").includes("timeout");
          const detail = isTimeout
            ? "timed out after 20s, payload " + approxKb + " KB"

      let subtabObserver = null;

      function scrollSubtabPillIntoView(subtabsEl, btn) {
        // Horizontal-only scroll of the pill row itself, so this can never
        // also nudge the page's vertical scroll (which is what caused the
        // "jumps back up" bug with scrollIntoView + block:"nearest").
        const targetLeft =
          btn.offsetLeft - (subtabsEl.clientWidth - btn.offsetWidth) / 2;
        subtabsEl.scrollTo({
          left: Math.max(0, targetLeft),
          behavior: "smooth",
        });
      }

      function setActiveSubtab(subtabsEl, btn) {
        subtabsEl
          .querySelectorAll(".subtab")
          .forEach((b) => b.classList.toggle("active", b === btn));
        scrollSubtabPillIntoView(subtabsEl, btn);
      }

      function renderSubtabs(sec) {
        const subtabsEl = document.getElementById("subtabs");
        const subs = ((sec && sec.subsections) || []).filter(
          (sub) => sub.items && sub.items.length,
        );
        if (subtabObserver) {
          subtabObserver.disconnect();
          subtabObserver = null;
        }
        if (subtabScrollTimer) {
          clearTimeout(subtabScrollTimer);
          subtabScrollTimer = null;
        }
        subtabProgrammaticScroll = false;
        if (subs.length < 2) {
          subtabsEl.classList.add("hidden");
          subtabsEl.innerHTML = "";
          return;
        }
        subtabsEl.classList.remove("hidden");
        subtabsEl.innerHTML = subs
          .map(
            (sub, i) =>
              `<button type="button" class="subtab ${i === 0 ? "active" : ""}" data-ssid="${sub.id}">${escapeHtml(sub.title)}</button>`,
          )
          .join("");
        subtabsEl.querySelectorAll(".subtab").forEach((btn) => {
          btn.onclick = () => {
            const heading = document.getElementById(
              "subhead-" + btn.dataset.ssid,
            );
            // Mute the scroll-spy observer for the duration of this smooth
            // scroll so it can't "correct" us mid-flight to a heading that
            // briefly crosses the threshold on the way down.
            subtabProgrammaticScroll = true;
            if (subtabScrollTimer) clearTimeout(subtabScrollTimer);
            subtabScrollTimer = setTimeout(() => {
              subtabProgrammaticScroll = false;
            }, 700);
            if (heading)
              heading.scrollIntoView({ behavior: "smooth", block: "start" });
            setActiveSubtab(subtabsEl, btn);
          };
        });
        subtabObserver = new IntersectionObserver(
          (entries) => {
            if (subtabProgrammaticScroll) return;
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              const ssid = entry.target.id.replace("subhead-", "");
              const btn = subtabsEl.querySelector(
                `.subtab[data-ssid="${ssid}"]`,
              );
              if (btn) setActiveSubtab(subtabsEl, btn);
            });
          },
          { rootMargin: "-45% 0px -50% 0px" },
        );
        subs.forEach((sub) => {
          const heading = document.getElementById("subhead-" + sub.id);
          if (heading) subtabObserver.observe(heading);
        });
      }

      async function updatePin() {
        const newPin = document.getElementById("fPin").value.trim();
        if (!newPin) {
          showToast("Enter a new PIN first");
          return;
        }
        if (newPin === sessionPinAdmin) {
          showToast("That's already the current PIN");
          return;
        }
        const { data, error } = await supabaseClient.rpc("change_pin", {
          p_slug: MENU_SLUG,
          p_old_pin: sessionPinAdmin,
          p_new_pin: newPin,
        });
        if (!error && data === true) {
          sessionPinAdmin = newPin;
          try {
            sessionStorage.setItem(ADMIN_SESSION_KEY, newPin);
          } catch (e) {}
          showToast("PIN updated");
        } else {
          showToast(pinErrorMessage(error, "Could not update PIN"));

          if (!dragging) return;

      function getSubsection(sectionId, subsectionId) {
        const sec = state.sections.find((s) => s.id === sectionId);
        return sec
          ? (sec.subsections || []).find((s) => s.id === subsectionId)
          : null;
      }

      function moveSubsection(sectionId, id, dir) {
        const sec = state.sections.find((s) => s.id === sectionId);
        if (!sec) return;
        const idx = sec.subsections.findIndex((s) => s.id === id),
          newIdx = idx + dir;
        if (idx < 0 || newIdx < 0 || newIdx >= sec.subsections.length) return;
        [sec.subsections[idx], sec.subsections[newIdx]] = [
          sec.subsections[newIdx],
          sec.subsections[idx],
        ];
        markDirty();
        renderAdmin();
      }

      function moveSection(id, dir) {
        const idx = state.sections.findIndex((s) => s.id === id),
          newIdx = idx + dir;
        if (idx < 0 || newIdx < 0 || newIdx >= state.sections.length) return;
        [state.sections[idx], state.sections[newIdx]] = [
          state.sections[newIdx],
          state.sections[idx],
        ];
        markDirty();
        renderAdmin();
      }

      function moveItem(sectionId, subsectionId, itemId, dir) {
        const sub = getSubsection(sectionId, subsectionId);
        if (!sub) return;
        const idx = sub.items.findIndex((i) => i.id === itemId),
          newIdx = idx + dir;
        if (idx < 0 || newIdx < 0 || newIdx >= sub.items.length) return;
        [sub.items[idx], sub.items[newIdx]] = [
          sub.items[newIdx],
          sub.items[idx],
        ];
        markDirty();
        renderAdmin();
      }

      // Given a container of draggable item cards and the pointer's Y position,
      // returns the card that should come immediately after the dragged card
      // (or null if it belongs at the end).
      function getDragAfterElement(container, y) {
        const els = [
          ...container.querySelectorAll(".admin-item-card:not(.dragging)"),
        ];
        return els.reduce(
          (closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
              return {
                offset,
                element: child,
              };
            }
            return closest;
          },
          {
            offset: -Infinity,
            element: null,
          },
        ).element;
      }

      // While touch-dragging near the top/bottom of the scrollable panel,
      // nudge it to scroll so you can drop items further up/down the list.
      function autoScrollPanelScroll(clientY) {
        const scrollEl = document.querySelector("#panel .panel-scroll");
        if (!scrollEl) return;
        const rect = scrollEl.getBoundingClientRect();
        const edge = 60;
        let speed = 0;
        if (clientY < rect.top + edge) {
          speed = -Math.ceil((rect.top + edge - clientY) / 4);
        } else if (clientY > rect.bottom - edge) {
          speed = Math.ceil((clientY - (rect.bottom - edge)) / 4);
        }
        if (speed !== 0) scrollEl.scrollTop += speed;
      }

      <button class="btn btn-sm btn-danger" data-field="delete">Delete item</button>
    </div>
    </div>
  `;
        const dragHandle = div.querySelector('[data-field="dragHandle"]');
        const moveUpBtn = div.querySelector('[data-field="moveUp"]');
        const moveDownBtn = div.querySelector('[data-field="moveDown"]');
        const headEl = div.querySelector('[data-field="head"]');
        const controlsToggleBtn = div.querySelector(
          '[data-field="controlsToggle"]',
        );

        controlsToggleBtn.onclick = () => {
          const expanded = headEl.classList.toggle("controls-expanded");
          controlsToggleBtn.setAttribute(
            "aria-expanded",
            expanded ? "true" : "false",
          );
          controlsToggleBtn.setAttribute(
            "aria-label",
            expanded ? "Hide reorder controls" : "Show reorder controls",
          );
        };

        dragHandle.addEventListener("dragstart", (e) => {
          dragState = {
            sectionId,
            subsectionId,
            itemId: item.id,
          };
          div.classList.add("dragging");

            e.dataTransfer.setDragImage(div, 20, 20);
          } catch (err) {}
        });
        dragHandle.addEventListener("dragend", () => {
          div.classList.remove("dragging");
          dragState = null;
          // Re-render from state: commits the new order if a drop happened,
          // or snaps back to the original order if the drag was cancelled.
          renderAdmin();
        });

        // Touch equivalent of the above — native HTML5 drag/drop doesn't
        // fire on touch devices, so this is a manual re-implementation.
        let touchClone = null;
        let touchOffsetX = 0;
        let touchOffsetY = 0;

        dragHandle.addEventListener(
          "touchstart",
          (e) => {
            if (!e.touches || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const rect = div.getBoundingClientRect();
            touchOffsetX = touch.clientX - rect.left;
            touchOffsetY = touch.clientY - rect.top;

            dragState = { sectionId, subsectionId, itemId: item.id };
            div.classList.add("dragging");

            touchClone = div.cloneNode(true);
            touchClone.classList.add("drag-clone");
            touchClone.style.width = rect.width + "px";
            touchClone.style.left = rect.left + "px";
            touchClone.style.top = rect.top + "px";
            document.body.appendChild(touchClone);
          },
          { passive: true },
        );

        dragHandle.addEventListener(
          "touchmove",
          (e) => {
            if (!dragState || dragState.itemId !== item.id || !touchClone)
              return;
            e.preventDefault(); // stop the page from scrolling while dragging
            const touch = e.touches[0];
            touchClone.style.left = touch.clientX - touchOffsetX + "px";
            touchClone.style.top = touch.clientY - touchOffsetY + "px";

            const itemsWrap = div.parentElement;
            if (itemsWrap) {
              const afterEl = getDragAfterElement(itemsWrap, touch.clientY);
              if (afterEl == null) {
                if (itemsWrap.lastElementChild !== div)
                  itemsWrap.appendChild(div);
              } else if (afterEl !== div) {
                itemsWrap.insertBefore(div, afterEl);

          if (!dragState) return;

          div.classList.remove("dragging");
          if (touchClone) {
            touchClone.remove();
            touchClone = null;
          }
          if (itemsWrap) {
            const sub = getSubsection(
              dragState.sectionId,
              dragState.subsectionId,
            );
            if (sub) {
              const newOrder = Array.from(
                itemsWrap.querySelectorAll(".admin-item-card"),
              ).map((el) => el.dataset.itemId);
              sub.items.sort(
                (a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id),
              );
              markDirty();
            }
          }
          dragState = null;
          renderAdmin();
        });

        moveUpBtn.onclick = () =>
          moveItem(sectionId, subsectionId, item.id, -1);
        moveDownBtn.onclick = () =>
          moveItem(sectionId, subsectionId, item.id, 1);

        const toggleBtn = div.querySelector('[data-field="toggle"]');
        toggleBtn.onclick = () => {
          const nowCollapsed = div.classList.toggle("collapsed");
          if (nowCollapsed) {
            expandedItems.delete(item.id);
          } else {
            expandedItems.add(item.id);
          }
          toggleBtn.setAttribute(
            "aria-expanded",
            nowCollapsed ? "false" : "true",
          );
          toggleBtn.setAttribute(
            "aria-label",
            nowCollapsed ? "Expand item" : "Collapse item",
          );
        };
        const nameInput = div.querySelector('[data-field="name"]');
        const priceInput = div.querySelector('[data-field="price"]');
        const imageInput = div.querySelector('[data-field="image"]');
        const imageFileInput = div.querySelector('[data-field="imageFile"]');
        const imagePreviewWrap = div.querySelector(
          '[data-field="imagePreviewWrap"]',
        );
        const imagePreview = div.querySelector('[data-field="imagePreview"]');
        const removeImageBtn = div.querySelector('[data-field="removeImage"]');
        const descInput = div.querySelector('[data-field="description"]');
        const likePercentInput = div.querySelector(
          '[data-field="likePercent"]',
        );
        const availInput = div.querySelector('[data-field="available"]');
        const deleteBtn = div.querySelector('[data-field="delete"]');
        const tagWrap = div.querySelector(".tag-toggles");

        function findItem() {
          const sub = getSubsection(sectionId, subsectionId);
          return sub ? sub.items.find((i) => i.id === item.id) : null;
        }

        Object.keys(TAG_META).forEach((tagKey) => {
          const chip = document.createElement("span");
          chip.className =
            "tag-chip" + ((item.tags || []).includes(tagKey) ? " on" : "");
          chip.textContent = TAG_META[tagKey].label;
          chip.title = TAG_META[tagKey].title;
          chip.onclick = () => {
            const cur = findItem();
            if (!cur) return;
            cur.tags = cur.tags || [];
            const i = cur.tags.indexOf(tagKey);
            if (i > -1) cur.tags.splice(i, 1);
            else cur.tags.push(tagKey);
            chip.classList.toggle("on");
            markDirty();
          };
          tagWrap.appendChild(chip);
        });

        nameInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.name = nameInput.value.trim() || "Untitled item";
            markDirty();
          }
        };
        priceInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.price = priceInput.value.trim() || "0.00";
            markDirty();
          }
        };
        likePercentInput.onchange = () => {
          const cur = findItem();
          if (!cur) return;
          const v = likePercentInput.value.trim();
          if (v === "") {
            delete cur.likePercent;
          } else {
            let n = Math.round(Number(v));
            if (isNaN(n)) n = 0;
            n = Math.max(0, Math.min(100, n));
            cur.likePercent = n;
            likePercentInput.value = n;
          }
          markDirty();
        };

        function setPreview(url) {
          if (url) {
            imagePreview.src = url;
            imagePreviewWrap.style.display = "";
          } else {
            imagePreview.src = "";
            imagePreviewWrap.style.display = "none";
          }
        }

        imageInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.image = imageInput.value.trim();
            setPreview(cur.image);
            markDirty();
          }
        };

        imageFileInput.onchange = async () => {
          const file = imageFileInput.files && imageFileInput.files[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            showToast("Please choose an image file");
            imageFileInput.value = "";
            return;
          }
          const cur = findItem();
          if (!cur) return;
          showToast("Uploading image…", 60000);
          try {
            const { url, path } = await uploadItemImage(file, cur.imagePath);
            cur.image = url;
            cur.imagePath = path;
            imageInput.value = "";
            setPreview(url);
            markDirty();
            showToast("Image uploaded");
          } catch (e) {
            console.error("Image upload failed:", e);
            showToast("Could not upload that image");
          }
          imageFileInput.value = "";
        };

        removeImageBtn.onclick = () => {
          const cur = findItem();
          if (cur) {
            if (cur.imagePath) {
              supabaseClient.storage
                .from(MENU_BUCKET)
                .remove([cur.imagePath])
                .catch(() => {});
            }
            cur.image = "";
            cur.imagePath = "";
            imageInput.value = "";
            setPreview("");
            markDirty();
          }
        };
        descInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.description = descInput.value.trim();
            markDirty();
          }
        };
        availInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.available = availInput.checked;
            markDirty();
          }
        };
        deleteBtn.onclick = () => {
          const sub = getSubsection(sectionId, subsectionId);
          if (sub) sub.items = sub.items.filter((i) => i.id !== item.id);
          markDirty();
          renderAdmin();
        };

        return div;
      }

      function addSection() {
        const sec = {
          id: uid("s"),
          title: "New category",
          subsections: [{ id: uid("ss"), title: "General", items: [] }],
        };
        state.sections.push(sec);
        if (!activeSection) activeSection = sec.id;
        markDirty();
        renderAdmin();
      }

      function restoreStaffSessions() {
        try {
          const pin = sessionStorage.getItem(ADMIN_SESSION_KEY);
          if (pin) {
            sessionPinAdmin = pin;
            unlockedAdmin = true;
          }
        } catch (e) {}
        try {
          const raw = sessionStorage.getItem(ORDERS_SESSION_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.pin) {
              sessionPinOrders = parsed.pin;
              staffRole = parsed.role || null;
              unlockedOrders = true;
            }
          }
        } catch (e) {}
      }

      // Browsers throttle or fully suspend setInterval timers while a tab
      // is backgrounded, minimized, or the screen is locked — common on a
      // staff tablet left sitting idle. That made new "calling a waiter"
      // requests (and ones just cleared with "Got it") only show up again
      // once something forced a fresh fetch, i.e. a full page reload.
      // Force that same fresh fetch the moment the tab/window is active
      // again, instead of waiting on the next (possibly stalled) tick.
      function resyncLiveOrdersNow() {
        if (serviceRequestsPollTimer) refreshServiceRequests();
        if (staffOrdersPollTimer) refreshOrdersDashboard();
        if (isAdminDevice || isStaffDevice) refreshOrdersBadge();
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") resyncLiveOrdersNow();
      });
      window.addEventListener("focus", resyncLiveOrdersNow);

      restoreStaffSessions();
      initAdminVisibility();
      window.addEventListener("hashchange", initAdminVisibility);
      initFooterRecoveryTap();
      initStaffRecoveryTap();
      loadData();
    </script>
  </body>
</html>
