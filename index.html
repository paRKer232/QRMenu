      function fileToOptimizedBlob(file, maxDim = 700, quality = 0.75) {
        const hasAlpha =
          file.type === "image/png" ||
          file.type === "image/webp" ||
          file.type === "image/gif";
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("read failed"));
          reader.onload = (e) => {
            const img = new Image();
            img.onerror = () => reject(new Error("decode failed"));
            img.onload = () => {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round(height * (maxDim / width));
                  width = maxDim;
                } else {
                  width = Math.round(width * (maxDim / height));
                  height = maxDim;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              const mime = hasAlpha ? "image/png" : "image/jpeg";
              canvas.toBlob(
                (blob) =>
                  blob
                    ? resolve({
                        blob,
                        mime,
                      })
                    : reject(new Error("toBlob failed")),
                mime,
                quality,
              );
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function uploadItemImage(file, oldPath) {
        const { blob, mime } = await fileToOptimizedBlob(file);
        const ext = mime === "image/png" ? "png" : "jpg";
        const path = `${MENU_SLUG}/${uid("img")}.${ext}`;

        const { error: upErr } = await supabaseClient.storage
          .from(MENU_BUCKET)
          .upload(path, blob, {
            contentType: mime,
            cacheControl: "31536000",
            upsert: false,
          });
        if (upErr) throw upErr;

        const { data: signed, error: signErr } = await supabaseClient.storage
          .from(MENU_BUCKET)
          .createSignedUrl(path, SIGNED_URL_TTL);
        if (signErr) throw signErr;

        if (oldPath) {
          supabaseClient.storage
            .from(MENU_BUCKET)
            .remove([oldPath])
            .catch(() => {});
        }

        return {
          url: signed.signedUrl,
          path,
        };
      }
      async function migrateBase64Images() {
        let count = 0;
        for (const sec of state.sections || []) {
          const allSubsections = sec.subsections || [
            { items: sec.items || [] },
          ];
          for (const sub of allSubsections) {
            for (const it of sub.items || []) {
              if (it.image && it.image.startsWith("data:")) {
                try {
                  const resp = await fetch(it.image);
                  const blob = await resp.blob();
                  const ext = blob.type === "image/png" ? "png" : "jpg";
                  const path = `${MENU_SLUG}/${uid("img")}.${ext}`;
                  const { error: upErr } = await supabaseClient.storage
                    .from(MENU_BUCKET)
                    .upload(path, blob, {
                      contentType: blob.type,
                      cacheControl: "31536000",
                    });
                  if (upErr) throw upErr;
                  const { data: signed, error: signErr } =
                    await supabaseClient.storage
                      .from(MENU_BUCKET)
                      .createSignedUrl(path, SIGNED_URL_TTL);
                  if (signErr) throw signErr;
                  it.image = signed.signedUrl;
                  it.imagePath = path;
                  count++;
                } catch (e) {
                  console.error("Migration failed for an item:", e);
                }
              }
            }
          }
        }
        if (count > 0) {
          markDirty();
          renderAdmin();
          showToast(
            `Migrated ${count} photo(s) — click "Publish live" to save`,
          );
        } else {
          showToast("No embedded photos found");
        }
      }

        const d = document.createElement("div");
        d.textContent = str == null ? "" : String(str);

      // Keep older saved menus working while adding nested menu subsections.
      // A legacy section with direct items becomes one "General" subsection.
      function normalizeMenuSections() {
        if (!state.sections) state.sections = [];
        state.sections = state.sections.map((sec) => {
          if (!Array.isArray(sec.subsections)) {
            sec.subsections = [
              {
                id: uid("ss"),
                title: "General",
                items: Array.isArray(sec.items) ? sec.items : [],
              },
            ];
            delete sec.items;
          }
          sec.subsections = sec.subsections.map((sub) => ({
            id: sub.id || uid("ss"),
            title: sub.title || "General",
            items: Array.isArray(sub.items) ? sub.items : [],
          }));
          if (!sec.subsections.length) {
            sec.subsections.push({
              id: uid("ss"),
              title: "General",
              items: [],
            });
          }
          return sec;
        });
      }

      async function publishLive() {
        const btn = document.getElementById("publishLiveBtn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Publishing…";
        }
        let approxKb = 0;
        try {
          // Rough size check — big base64 photos are the most common reason
          // a publish stalls out on a slow mobile connection.
          approxKb = Math.round(JSON.stringify(state).length / 1024);
          console.log("Publishing menu, approx payload size:", approxKb, "KB");

          const timeoutMs = 20000;
          const timeout = new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error("timeout after " + timeoutMs + "ms")),
              timeoutMs,
            ),
          );

          const { data, error } = await Promise.race([
            supabaseClient.rpc("save_menu", {
              p_slug: MENU_SLUG,
              p_pin: sessionPin,
              p_data: state,
            }),
            timeout,
          ]);
          if (error || data !== true) {
            console.error("Publish rejected:", error, data);
            throw new Error(error ? error.message || "rejected" : "rejected");
          }
          dirty = false;
          showToast("Published live (" + approxKb + " KB)");
        } catch (e) {
          console.error("Publish failed:", e);
          const isTimeout = String(e.message || "").includes("timeout");
          const detail = isTimeout
            ? "timed out after 20s, payload " + approxKb + " KB"
            : "error: " + (e.message || "unknown");
          showToast("Publish failed — " + detail, 6000);
        }
        updatePublishUI();
      }

      function renderMenu() {
        const menu = document.getElementById("menu");
        const sec = state.sections.find((s) => s.id === activeSection);
        if (!sec) {
          menu.innerHTML =
            '<p class="empty-state">No sections yet. Open owner settings to add your first category.</p>';
          return;
        }
        const currency = state.business.currency || "$";
        let html = `<h3 class="section-heading">${escapeHtml(sec.title)}</h3>`;
        const subs = sec.subsections || [];
        if (!subs.length) {
          html +=
            '<p class="empty-state">No subsections in this section yet.</p>';
        } else {
          subs.forEach((sub) => {
            const showSubheading =
              subs.length > 1 ||
              (sub.title && sub.title.toLowerCase() !== "general");
            if (showSubheading) {
              html += `<h4 class="subsection-heading" id="subhead-${sub.id}">${escapeHtml(sub.title)}</h4>`;
            }
            if (!sub.items || sub.items.length === 0) {
              html += `<p class="empty-state subsection-empty">No items in ${escapeHtml(sub.title || "this subsection")} yet.</p>`;
              return;
            }
            html += '<div class="items-grid">';
            sub.items.forEach((it) => {
              const badges = (it.tags || [])
                .map((t) =>
                  TAG_META[t]
                    ? `<span class="badge" title="${TAG_META[t].title}">${TAG_META[t].label}</span>`
                    : "",
                )
                .join("");
              const priceHtml =
                it.available === false

                  : currency + escapeHtml(it.price);
              const descHtml = it.description
                ? `<p class="item-desc">${escapeHtml(it.description)}</p>`

              const mediaHtml = it.image

                : "";
              const vc = voteCounts[it.id] || { likes: 0, dislikes: 0 };
              const total = vc.likes + vc.dislikes;
              const hasOverride =
                it.likePercent !== undefined &&
                it.likePercent !== null &&
                it.likePercent !== "";
              const percent = hasOverride
                ? Math.max(0, Math.min(100, Math.round(Number(it.likePercent))))
                : total > 0
                  ? Math.round((vc.likes / total) * 100)
                  : null;
              const userVote = getUserVote(it.id);
              const percentLabel =
                percent === null
                  ? ""
                  : `<span class="vote-percent">${percent}% харесват</span>`;
              const voteRow =
                it.available === false
                  ? ""

  <button class="vote-btn like ${userVote === "like" ? "active" : ""}" type="button" data-item="${it.id}" aria-label="Like this item" onclick="castVote('${it.id}','like',this)">👍</button>
  <button class="vote-btn dislike ${userVote === "dislike" ? "active" : ""}" type="button" data-item="${it.id}" aria-label="Dislike this item" onclick="castVote('${it.id}','dislike',this)">👎</button>
  ${percentLabel}
</div>`;
              html += `<div class="item ${it.available === false ? "unavailable" : ""} ${it.image ? "" : "no-media"}">
              ${mediaHtml}<div class="item-body"><div class="item-top"><span class="item-name">${escapeHtml(it.name)}</span><span class="item-badges">${badges}</span></div>
             ${descHtml}<div class="item-foot"><span class="item-price">${priceHtml}</span>${voteRow}</div></div></div>`;
            });
            html += "</div>";
          });
        }
        menu.innerHTML = html;
        renderSubtabs(sec);
      }

      let subtabObserver = null;
      let subtabProgrammaticScroll = false;
      let subtabScrollTimer = null;

      function scrollSubtabPillIntoView(subtabsEl, btn) {
        // Horizontal-only scroll of the pill row itself, so this can never
        // also nudge the page's vertical scroll (which is what caused the
        // "jumps back up" bug with scrollIntoView + block:"nearest").
        const targetLeft =
          btn.offsetLeft - (subtabsEl.clientWidth - btn.offsetWidth) / 2;
        subtabsEl.scrollTo({
          left: Math.max(0, targetLeft),
          behavior: "smooth",
        });
      }

      function setActiveSubtab(subtabsEl, btn) {
        subtabsEl
          .querySelectorAll(".subtab")
          .forEach((b) => b.classList.toggle("active", b === btn));
        scrollSubtabPillIntoView(subtabsEl, btn);
      }

      function renderSubtabs(sec) {
        const subtabsEl = document.getElementById("subtabs");
        const subs = ((sec && sec.subsections) || []).filter(
          (sub) => sub.items && sub.items.length,
        );
        if (subtabObserver) {
          subtabObserver.disconnect();
          subtabObserver = null;
        }
        if (subtabScrollTimer) {
          clearTimeout(subtabScrollTimer);
          subtabScrollTimer = null;
        }
        subtabProgrammaticScroll = false;
        if (subs.length < 2) {
          subtabsEl.classList.add("hidden");
          subtabsEl.innerHTML = "";
          return;
        }
        subtabsEl.classList.remove("hidden");
        subtabsEl.innerHTML = subs
          .map(
            (sub, i) =>
              `<button type="button" class="subtab ${i === 0 ? "active" : ""}" data-ssid="${sub.id}">${escapeHtml(sub.title)}</button>`,
          )
          .join("");
        subtabsEl.querySelectorAll(".subtab").forEach((btn) => {
          btn.onclick = () => {
            const heading = document.getElementById(
              "subhead-" + btn.dataset.ssid,
            );
            // Mute the scroll-spy observer for the duration of this smooth
            // scroll so it can't "correct" us mid-flight to a heading that
            // briefly crosses the threshold on the way down.
            subtabProgrammaticScroll = true;
            if (subtabScrollTimer) clearTimeout(subtabScrollTimer);
            subtabScrollTimer = setTimeout(() => {
              subtabProgrammaticScroll = false;
            }, 700);
            if (heading)
              heading.scrollIntoView({ behavior: "smooth", block: "start" });
            setActiveSubtab(subtabsEl, btn);
          };
        });
        subtabObserver = new IntersectionObserver(
          (entries) => {
            if (subtabProgrammaticScroll) return;
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              const ssid = entry.target.id.replace("subhead-", "");
              const btn = subtabsEl.querySelector(
                `.subtab[data-ssid="${ssid}"]`,
              );
              if (btn) setActiveSubtab(subtabsEl, btn);
            });
          },
          { rootMargin: "-45% 0px -50% 0px" },
        );
        subs.forEach((sub) => {
          const heading = document.getElementById("subhead-" + sub.id);
          if (heading) subtabObserver.observe(heading);
        });
      }

      function renderAdmin() {

    <button class="btn btn-danger btn-block" style="margin-top:8px;" onclick="confirmForgetDevice();">Forget this device</button>
    </div>
  `;

        document.getElementById("fName").onchange = (e) => {
          state.business.name = e.target.value.trim() || "Your Menu";
          markDirty();

        document.getElementById("fTagline").onchange = (e) => {

        // theme dots

      async function tryUnlock() {
        const val = document.getElementById("pinInput").value.trim();
        try {
          const { data, error } = await supabaseClient.rpc("check_pin", {
            p_slug: MENU_SLUG,
            p_pin: val,

      function renderSectionsAdmin() {

      function buildSubsectionAdmin(sec, sub, parent) {
        const card = document.createElement("div");
        card.className = "admin-subsection-card";
        card.innerHTML = `
        <div class="admin-subsection-head">
          <input type="text" value="${escapeHtml(sub.title)}" data-role="subsectionTitle" placeholder="Subsection name (e.g. Wine, Beer, Cocktails)">
          <button class="btn btn-sm" data-role="subMoveUp" title="Move up">↑</button>
          <button class="btn btn-sm" data-role="subMoveDown" title="Move down">↓</button>
          <button class="btn btn-sm btn-danger" data-role="deleteSubsection">Delete</button>
        </div>
        <div class="subsection-items" data-role="itemsWrap"></div>
        <button class="btn btn-sm" data-role="addItem">+ Add item</button>
      `;
        parent.appendChild(card);
        const itemsWrap = card.querySelector('[data-role="itemsWrap"]');
        (sub.items || []).forEach((it) =>
          itemsWrap.appendChild(buildItemCard(sec.id, sub.id, it)),
        );

        itemsWrap.addEventListener("dragover", (e) => {
          if (
            !dragState ||
            dragState.sectionId !== sec.id ||
            dragState.subsectionId !== sub.id
          )
            return;
          e.preventDefault();
          const dragging = itemsWrap.querySelector(".admin-item-card.dragging");
          if (!dragging) return;
          const afterEl = getDragAfterElement(itemsWrap, e.clientY);
          if (afterEl == null) itemsWrap.appendChild(dragging);
          else if (afterEl !== dragging)
            itemsWrap.insertBefore(dragging, afterEl);
        });
        itemsWrap.addEventListener("drop", (e) => {
          if (
            !dragState ||
            dragState.sectionId !== sec.id ||
            dragState.subsectionId !== sub.id
          )
            return;
          e.preventDefault();
          const newOrder = Array.from(
            itemsWrap.querySelectorAll(".admin-item-card"),
          ).map((el) => el.dataset.itemId);
          sub.items.sort(
            (a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id),
          );
          markDirty();
          dragState = null;
        });

        const title = card.querySelector('[data-role="subsectionTitle"]');
        title.onchange = () => {
          sub.title = title.value.trim() || "Untitled subsection";
          markDirty();
        };
        card.querySelector('[data-role="subMoveUp"]').onclick = () =>
          moveSubsection(sec.id, sub.id, -1);
        card.querySelector('[data-role="subMoveDown"]').onclick = () =>
          moveSubsection(sec.id, sub.id, 1);
        card.querySelector('[data-role="deleteSubsection"]').onclick = () => {
          if ((sec.subsections || []).length === 1) {
            showToast("Keep at least one subsection in a category");
            return;
          }
          sec.subsections = sec.subsections.filter((s) => s.id !== sub.id);
          markDirty();
          renderAdmin();
        };
        card.querySelector('[data-role="addItem"]').onclick = () => {
          sub.items = sub.items || [];
          const newItem = {
            id: uid("i"),
            name: "New item",
            description: "",
            price: "0.00",
            tags: [],
            available: true,
          };
          sub.items.push(newItem);
          expandedItems.add(newItem.id);
          markDirty();
          renderAdmin();
        };
      }

      function getSubsection(sectionId, subsectionId) {
        const sec = state.sections.find((s) => s.id === sectionId);
        return sec
          ? (sec.subsections || []).find((s) => s.id === subsectionId)
          : null;
      }

      function moveSubsection(sectionId, id, dir) {
        const sec = state.sections.find((s) => s.id === sectionId);
        if (!sec) return;
        const idx = sec.subsections.findIndex((s) => s.id === id),
          newIdx = idx + dir;
        if (idx < 0 || newIdx < 0 || newIdx >= sec.subsections.length) return;
        [sec.subsections[idx], sec.subsections[newIdx]] = [
          sec.subsections[newIdx],
          sec.subsections[idx],
        ];
        markDirty();
        renderAdmin();
      }

      function moveSection(id, dir) {
        const idx = state.sections.findIndex((s) => s.id === id),
          newIdx = idx + dir;
        if (idx < 0 || newIdx < 0 || newIdx >= state.sections.length) return;
        [state.sections[idx], state.sections[newIdx]] = [
          state.sections[newIdx],
          state.sections[idx],
        ];
        markDirty();
        renderAdmin();
      }

      function moveItem(sectionId, subsectionId, itemId, dir) {
        const sub = getSubsection(sectionId, subsectionId);
        if (!sub) return;
        const idx = sub.items.findIndex((i) => i.id === itemId),
          newIdx = idx + dir;
        if (idx < 0 || newIdx < 0 || newIdx >= sub.items.length) return;
        [sub.items[idx], sub.items[newIdx]] = [
          sub.items[newIdx],
          sub.items[idx],
        ];
        markDirty();
        renderAdmin();
      }

      // Given a container of draggable item cards and the pointer's Y position,
      // returns the card that should come immediately after the dragged card
      // (or null if it belongs at the end).
      function getDragAfterElement(container, y) {
        const els = [
          ...container.querySelectorAll(".admin-item-card:not(.dragging)"),
        ];
        return els.reduce(
          (closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
              return {
                offset,
                element: child,
              };
            }
            return closest;
          },
          {
            offset: -Infinity,
            element: null,
          },
        ).element;
      }

      // While touch-dragging near the top/bottom of the scrollable panel,
      // nudge it to scroll so you can drop items further up/down the list.
      function autoScrollPanelScroll(clientY) {
        const scrollEl = document.querySelector("#panel .panel-scroll");
        if (!scrollEl) return;
        const rect = scrollEl.getBoundingClientRect();
        const edge = 60;
        let speed = 0;
        if (clientY < rect.top + edge) {
          speed = -Math.ceil((rect.top + edge - clientY) / 4);
        } else if (clientY > rect.bottom - edge) {
          speed = Math.ceil((clientY - (rect.bottom - edge)) / 4);
        }
        if (speed !== 0) scrollEl.scrollTop += speed;
      }

      function buildItemCard(sectionId, subsectionId, item) {
        const isOpen = expandedItems.has(item.id);
        const div = document.createElement("div");
        div.className = "admin-item-card" + (isOpen ? "" : " collapsed");
        div.dataset.itemId = item.id;
        div.innerHTML = `
    <div class="admin-item-card-head" data-field="head">
      <button type="button" class="item-card-toggle" data-field="toggle" aria-expanded="${isOpen ? "true" : "false"}" aria-label="${isOpen ? "Collapse item" : "Expand item"}">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input type="text" value="${escapeHtml(item.name)}" data-field="name" placeholder="Item name">
      <input type="text" value="${escapeHtml(item.price)}" data-field="price" placeholder="Price" style="max-width:90px;">
      <button type="button" class="item-controls-toggle" data-field="controlsToggle" aria-expanded="false" aria-label="Show reorder controls" title="Reorder">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="4" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="16" r="1.6" fill="currentColor"/></svg>
      </button>
      <div class="item-reorder-controls" data-field="reorderControls">
        <button type="button" class="item-drag-handle" data-field="dragHandle" draggable="true" aria-label="Drag to reorder" title="Drag to reorder">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="7" cy="5" r="1.4" fill="currentColor"/><circle cx="13" cy="5" r="1.4" fill="currentColor"/><circle cx="7" cy="10" r="1.4" fill="currentColor"/><circle cx="13" cy="10" r="1.4" fill="currentColor"/><circle cx="7" cy="15" r="1.4" fill="currentColor"/><circle cx="13" cy="15" r="1.4" fill="currentColor"/></svg>
        </button>
        <button type="button" class="btn btn-sm" data-field="moveUp" title="Move up">↑</button>
        <button type="button" class="btn btn-sm" data-field="moveDown" title="Move down">↓</button>
      </div>
    </div>
    <div class="admin-item-card-body" data-field="body">
    <div class="field">
      <label>Image</label>
      <div class="image-field-row">
        <input type="text" value="${escapeHtml(item.image && !item.image.startsWith("data:") ? item.image : "")}" data-field="image" placeholder="Image URL (optional)">
        <label class="btn btn-sm image-upload-btn">Upload
          <input type="file" accept="image/*" data-field="imageFile" hidden>
        </label>
      </div>
      <div class="image-preview-wrap" data-field="imagePreviewWrap" ${item.image ? "" : 'style="display:none;"'}>
        <img class="image-preview" data-field="imagePreview" src="${escapeHtml(item.image || "")}" alt="">
        <button type="button" class="btn btn-sm btn-danger" data-field="removeImage">Remove image</button>
      </div>
    </div>
    <div class="field"><textarea data-field="description" placeholder="Short description">${escapeHtml(item.description)}</textarea></div>
    <div class="field">
      <label>Like % override (blank = use real votes)</label>
      <input type="number" min="0" max="100" value="${item.likePercent !== undefined && item.likePercent !== null ? item.likePercent : ""}" data-field="likePercent" placeholder="Auto from customer votes">
    </div>
    <div class="tag-toggles"></div>
    <div class="item-card-foot">
      <label class="avail-toggle"><input type="checkbox" data-field="available" ${item.available !== false ? "checked" : ""}> Available</label>
      <button class="btn btn-sm btn-danger" data-field="delete">Delete item</button>
    </div>
    </div>
  `;
        const dragHandle = div.querySelector('[data-field="dragHandle"]');
        const moveUpBtn = div.querySelector('[data-field="moveUp"]');
        const moveDownBtn = div.querySelector('[data-field="moveDown"]');
        const headEl = div.querySelector('[data-field="head"]');
        const controlsToggleBtn = div.querySelector(
          '[data-field="controlsToggle"]',
        );

        controlsToggleBtn.onclick = () => {
          const expanded = headEl.classList.toggle("controls-expanded");
          controlsToggleBtn.setAttribute(
            "aria-expanded",
            expanded ? "true" : "false",
          );
          controlsToggleBtn.setAttribute(
            "aria-label",
            expanded ? "Hide reorder controls" : "Show reorder controls",
          );
        };

        dragHandle.addEventListener("dragstart", (e) => {
          dragState = {
            sectionId,
            subsectionId,
            itemId: item.id,
          };
          div.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", item.id);
          try {
            e.dataTransfer.setDragImage(div, 20, 20);
          } catch (err) {}
        });
        dragHandle.addEventListener("dragend", () => {
          div.classList.remove("dragging");
          dragState = null;
          // Re-render from state: commits the new order if a drop happened,
          // or snaps back to the original order if the drag was cancelled.
          renderAdmin();
        });

        // Touch equivalent of the above — native HTML5 drag/drop doesn't
        // fire on touch devices, so this is a manual re-implementation.
        let touchClone = null;
        let touchOffsetX = 0;
        let touchOffsetY = 0;

        dragHandle.addEventListener(
          "touchstart",
          (e) => {
            if (!e.touches || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const rect = div.getBoundingClientRect();
            touchOffsetX = touch.clientX - rect.left;
            touchOffsetY = touch.clientY - rect.top;

            dragState = { sectionId, subsectionId, itemId: item.id };
            div.classList.add("dragging");

            touchClone = div.cloneNode(true);
            touchClone.classList.add("drag-clone");
            touchClone.style.width = rect.width + "px";
            touchClone.style.left = rect.left + "px";
            touchClone.style.top = rect.top + "px";
            document.body.appendChild(touchClone);
          },
          { passive: true },
        );

        dragHandle.addEventListener(
          "touchmove",
          (e) => {
            if (!dragState || dragState.itemId !== item.id || !touchClone)
              return;
            e.preventDefault(); // stop the page from scrolling while dragging
            const touch = e.touches[0];
            touchClone.style.left = touch.clientX - touchOffsetX + "px";
            touchClone.style.top = touch.clientY - touchOffsetY + "px";

            const itemsWrap = div.parentElement;
            if (itemsWrap) {
              const afterEl = getDragAfterElement(itemsWrap, touch.clientY);
              if (afterEl == null) {
                if (itemsWrap.lastElementChild !== div)
                  itemsWrap.appendChild(div);
              } else if (afterEl !== div) {
                itemsWrap.insertBefore(div, afterEl);
              }
            }
            autoScrollPanelScroll(touch.clientY);
          },
          { passive: false },
        );

        dragHandle.addEventListener("touchend", () => {
          if (!dragState) return;
          const itemsWrap = div.parentElement;
          div.classList.remove("dragging");
          if (touchClone) {
            touchClone.remove();
            touchClone = null;
          }
          if (itemsWrap) {
            const sub = getSubsection(
              dragState.sectionId,
              dragState.subsectionId,
            );
            if (sub) {
              const newOrder = Array.from(
                itemsWrap.querySelectorAll(".admin-item-card"),
              ).map((el) => el.dataset.itemId);
              sub.items.sort(
                (a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id),
              );
              markDirty();
            }
          }
          dragState = null;
          renderAdmin();
        });

        moveUpBtn.onclick = () =>
          moveItem(sectionId, subsectionId, item.id, -1);
        moveDownBtn.onclick = () =>
          moveItem(sectionId, subsectionId, item.id, 1);

        const toggleBtn = div.querySelector('[data-field="toggle"]');
        toggleBtn.onclick = () => {
          const nowCollapsed = div.classList.toggle("collapsed");
          if (nowCollapsed) {
            expandedItems.delete(item.id);
          } else {
            expandedItems.add(item.id);
          }
          toggleBtn.setAttribute(
            "aria-expanded",
            nowCollapsed ? "false" : "true",
          );
          toggleBtn.setAttribute(
            "aria-label",
            nowCollapsed ? "Expand item" : "Collapse item",
          );
        };
        const nameInput = div.querySelector('[data-field="name"]');
        const priceInput = div.querySelector('[data-field="price"]');
        const imageInput = div.querySelector('[data-field="image"]');
        const imageFileInput = div.querySelector('[data-field="imageFile"]');
        const imagePreviewWrap = div.querySelector(
          '[data-field="imagePreviewWrap"]',
        );
        const imagePreview = div.querySelector('[data-field="imagePreview"]');
        const removeImageBtn = div.querySelector('[data-field="removeImage"]');
        const descInput = div.querySelector('[data-field="description"]');
        const likePercentInput = div.querySelector(
          '[data-field="likePercent"]',
        );
        const availInput = div.querySelector('[data-field="available"]');
        const deleteBtn = div.querySelector('[data-field="delete"]');
        const tagWrap = div.querySelector(".tag-toggles");

        function findItem() {
          const sub = getSubsection(sectionId, subsectionId);
          return sub ? sub.items.find((i) => i.id === item.id) : null;
        }

        Object.keys(TAG_META).forEach((tagKey) => {
          const chip = document.createElement("span");
          chip.className =
            "tag-chip" + ((item.tags || []).includes(tagKey) ? " on" : "");
          chip.textContent = TAG_META[tagKey].label;
          chip.title = TAG_META[tagKey].title;
          chip.onclick = () => {
            const cur = findItem();
            if (!cur) return;
            cur.tags = cur.tags || [];
            const i = cur.tags.indexOf(tagKey);
            if (i > -1) cur.tags.splice(i, 1);
            else cur.tags.push(tagKey);
            chip.classList.toggle("on");
            markDirty();
          };
          tagWrap.appendChild(chip);
        });

        nameInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.name = nameInput.value.trim() || "Untitled item";
            markDirty();
          }
        };
        priceInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.price = priceInput.value.trim() || "0.00";
            markDirty();
          }
        };
        likePercentInput.onchange = () => {
          const cur = findItem();
          if (!cur) return;
          const v = likePercentInput.value.trim();
          if (v === "") {
            delete cur.likePercent;
          } else {
            let n = Math.round(Number(v));
            if (isNaN(n)) n = 0;
            n = Math.max(0, Math.min(100, n));
            cur.likePercent = n;
            likePercentInput.value = n;
          }
          markDirty();
        };

        function setPreview(url) {
          if (url) {
            imagePreview.src = url;
            imagePreviewWrap.style.display = "";
          } else {
            imagePreview.src = "";
            imagePreviewWrap.style.display = "none";
          }
        }

        imageInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.image = imageInput.value.trim();
            setPreview(cur.image);
            markDirty();
          }
        };

        imageFileInput.onchange = async () => {
          const file = imageFileInput.files && imageFileInput.files[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            showToast("Please choose an image file");
            imageFileInput.value = "";
            return;
          }
          const cur = findItem();
          if (!cur) return;
          showToast("Uploading image…", 60000);
          try {
            const { url, path } = await uploadItemImage(file, cur.imagePath);
            cur.image = url;
            cur.imagePath = path;
            imageInput.value = "";
            setPreview(url);
            markDirty();
            showToast("Image uploaded");
          } catch (e) {
            console.error("Image upload failed:", e);
            showToast("Could not upload that image");
          }
          imageFileInput.value = "";
        };

        removeImageBtn.onclick = () => {
          const cur = findItem();
          if (cur) {
            if (cur.imagePath) {
              supabaseClient.storage
                .from(MENU_BUCKET)
                .remove([cur.imagePath])
                .catch(() => {});
            }
            cur.image = "";
            cur.imagePath = "";
            imageInput.value = "";
            setPreview("");
            markDirty();
          }
        };
        descInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.description = descInput.value.trim();
            markDirty();
          }
        };
        availInput.onchange = () => {
          const cur = findItem();
          if (cur) {
            cur.available = availInput.checked;
            markDirty();
          }
        };
        deleteBtn.onclick = () => {
          const sub = getSubsection(sectionId, subsectionId);
          if (sub) sub.items = sub.items.filter((i) => i.id !== item.id);
          markDirty();
          renderAdmin();
        };

        return div;
      }

      function addSection() {
        const sec = {
          id: uid("s"),
          title: "New category",
          subsections: [{ id: uid("ss"), title: "General", items: [] }],
        };
        state.sections.push(sec);
        if (!activeSection) activeSection = sec.id;
        markDirty();
        renderAdmin();
      }

      initAdminVisibility();
      window.addEventListener("hashchange", initAdminVisibility);
      loadData();
    </script>
  </body>
</html>
